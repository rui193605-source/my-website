<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 声明页面配色，让滚动条 / 表单控件跟随暗色主题，避免加载瞬间的白闪 -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070a">
<meta name="description" content="JERRY // 网络诊断：下载、上传、延迟与抖动测试">

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        /* 统一字体：与大标题一致 */
        --font-main:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Microsoft YaHei",
            sans-serif;

        /* 统一字号梯度 */
        --font-size-xs: 13px;
        --font-size-sm: 14px;
        --font-size-base: 16px;
        --font-size-md: 18px;
        --font-size-lg: 26px;
        --font-size-xl: 44px;
    }

    html {
        scroll-behavior: smooth;

        /* 原生控件（滚动条等）使用暗色渲染 */
        color-scheme: dark;
    }

    body {
        margin: 0;
        background: #05070a;
        color: #e8edf2;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Microsoft YaHei",
            sans-serif;
        overflow-x: hidden;
    }

    /* =========================背景网格========================= */

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.16;

        background-image:
            linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);

        background-size: 45px 45px;

        mask-image: linear-gradient(
            to bottom,
            black,
            transparent 85%
        );

        -webkit-mask-image: linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
    }

    /* =========================顶部导航========================= */

    nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;

        height: 70px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 7%;

        background: rgba(5,7,10,0.72);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        border-bottom: 1px solid rgba(255,255,255,0.08);

        z-index: 10;
    }

    .logo {
        font-weight: 800;
        letter-spacing: 4px;
        font-size: 18px;
    }

    .logo span {
        opacity: 0.45;
    }

    nav a {
        color: #aeb8c2;
        text-decoration: none;
        margin-left: 28px;
        font-size: 13px;
        letter-spacing: 1px;

        /* 只过渡实际会变的属性：transition: all 会让浏览器监听更多属性 */
        transition: color 0.25s;
    }

    nav a:hover {
        color: white;
    }

    /* =========================主区域========================= */

    .hero {
        min-height: 100vh;

        display: flex;
        align-items: center;

        padding: 100px 8% 60px;

        position: relative;
    }

    .hero-content {
        max-width: 850px;
    }

    .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;

        padding: 8px 13px;

        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;

        background: rgba(255,255,255,0.035);

        color: #9ca7b2;

        font-size: 12px;
        letter-spacing: 1px;
    }

    .status-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #6cff9b;

        box-shadow:
            0 0 10px #6cff9b;

        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%,100% {
            opacity: 0.45;
        }

        50% {
            opacity: 1;
        }
    }

    h1 {
        margin: 25px 0 10px;

        font-size: clamp(60px, 11vw, 150px);

        line-height: 0.9;

        letter-spacing: -7px;

        font-weight: 900;

        background: linear-gradient(
            120deg,
            #ffffff,
            #9aa6b2
        );

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;
    }

    .subtitle {
        font-size: clamp(18px, 2.2vw, 28px);

        color: #9da8b3;

        margin-top: 30px;
    }

    .terminal {
        margin-top: 38px;

        display: inline-block;

        padding: 18px 22px;

        border-left: 2px solid #6cff9b;

        background: rgba(255,255,255,0.035);

        color: #89949f;

        font-family: monospace;

        font-size: 14px;

        box-shadow:
            0 0 30px rgba(108,255,155,0.04);
    }

    .terminal strong {
        color: #6cff9b;
    }

    /* =========================鼠标光晕========================= */

    .glow {
        position: fixed;

        /* 用 top/left 定位会触发重排，这里统一交给 transform：
           初始位置放在屏幕外，避免首屏出现一个错位的光斑 */
        top: 0;
        left: 0;

        width: 500px;
        height: 500px;

        border-radius: 50%;

        pointer-events: none;

        background:
            radial-gradient(
                circle,
                rgba(120,150,255,0.10),
                transparent 65%
            );

        /* 走合成层，只做位移不参与布局计算 */
        transform: translate3d(-9999px, -9999px, 0);
        will-change: transform;

        z-index: -1;
    }

    /* =========================内容========================= */

    section {
        padding: 110px 8%;

        max-width: 1200px;

        margin: auto;
    }

    .section-label {
        color: #6cff9b;

        font-family: var(--font-main);

        font-size: var(--font-size-sm);

        letter-spacing: 3px;

        margin-bottom: 15px;
    }

    h2 {
        font-size: var(--font-size-xl);

        font-weight: 400;

        margin: 0 0 45px;

        letter-spacing: -1px;
    }

    /* =========================测速面板========================= */

    .speed-panel {
        width: 100%;

        border: 1px solid rgba(255,255,255,0.10);

        background: rgba(255,255,255,0.025);

        /* 原来的 backdrop-filter 在滚动 / 重绘时开销很大，
           而面板本身接近全透明，视觉收益几乎为零，故移除 */

        padding: 32px;

        box-shadow:
            0 0 40px rgba(0,0,0,0.25);

        /* 把重排 / 重绘限制在面板内部，测速时数字频繁刷新不会影响整页 */
        contain: layout style;
    }

    .speed-grid {
        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 20px;
    }

    .speed-card {
        border: 1px solid rgba(255,255,255,0.08);

        background: rgba(255,255,255,0.025);

        padding: 28px;

        min-height: 230px;

        display: flex;

        flex-direction: column;

        justify-content: space-between;
    }

    .speed-card-label {
        font-family: var(--font-main);

        font-size: var(--font-size-sm);

        letter-spacing: 3px;

        color: #8e99a4;
    }

    .speed-value {
        margin-top: 20px;

        font-family: var(--font-main);

        font-size: clamp(44px, 6vw, 72px);

        line-height: 1;

        font-weight: 400;

        letter-spacing: -3px;

        color: #ffffff;
    }

    .speed-unit {
        font-family: var(--font-main);

        font-size: var(--font-size-sm);

        color: #6cff9b;

        letter-spacing: 2px;

        margin-top: 10px;
    }

    .speed-progress {
        width: 100%;

        height: 3px;

        background: rgba(255,255,255,0.08);

        margin: 25px 0 20px;

        overflow: hidden;
    }

    .speed-progress-bar {
        width: 0%;

        height: 100%;

        background: #6cff9b;

        box-shadow:
            0 0 12px rgba(108,255,155,0.6);

        transition: width 0.2s linear;
    }

    .speed-button {
        width: 100%;

        padding: 13px 16px;

        border: 1px solid rgba(255,255,255,0.14);

        background: rgba(255,255,255,0.045);

        color: #dce3e9;

        font-family: var(--font-main);

        font-size: var(--font-size-xs);

        letter-spacing: 2px;

        cursor: pointer;

        /* 同上：只过渡实际变化的属性 */
        transition:
            border-color 0.25s,
            color 0.25s,
            background-color 0.25s;
    }

    .speed-button:hover {
        border-color: #6cff9b;

        color: #6cff9b;

        background: rgba(108,255,155,0.05);
    }

    .speed-button:disabled {
        cursor: not-allowed;

        opacity: 0.6;
    }

    /* =========================网络信息========================= */

    .network-info {
        display: grid;

        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 20px;

        margin-top: 20px;
    }

    .info-card {
        border-top: 1px solid rgba(255,255,255,0.10);

        padding: 22px 5px 5px;
    }

    .info-label {
        font-family: var(--font-main);

        font-size: var(--font-size-xs);

        font-weight: 400;

        letter-spacing: 2px;

        color: #7f8a95;
    }

    .info-value {
        margin-top: 9px;

        font-family: var(--font-main);

        font-size: var(--font-size-lg);

        font-weight: 400;

        color: #ffffff;
    }

    .info-unit {
        font-family: var(--font-main);

        font-size: var(--font-size-xs);

        color: #6cff9b;

        margin-left: 4px;
    }

    .speed-status {
        margin-top: 25px;

        font-family: var(--font-main);

        font-size: var(--font-size-sm);

        color: #7f8a95;

        min-height: 18px;
    }

    /* =========================关于========================= */

    .about {
        max-width: 760px;

        color: #89949e;

        font-size: 17px;

        line-height: 2;
    }

    .highlight {
        color: white;
    }

    /* =========================页脚========================= */

    footer {
        padding: 80px 8% 40px;

        color: #ffffff;

        font-family: monospace;

        font-size: 17px;

        font-weight: 700;

        display: flex;

        justify-content: space-between;

        border-top:
            1px solid rgb(255, 255, 255);
    }

    /* =========================手机端========================= */

    @media (max-width: 700px) {

        nav {
            padding: 0 5%;
        }

        nav a {
            margin-left: 12px;

            font-size: 11px;
        }

        .hero {
            min-height: auto;

            padding-top: 100px;

            padding-left: 6%;
            padding-right: 6%;

            padding-bottom: 100px;
        }

        h1 {
            letter-spacing: -4px;
        }

        section {
            padding-left: 6%;
            padding-right: 6%;
        }

        h2 {
            font-size: 34px;
        }

        .speed-panel {
            padding: 18px;
        }

        .speed-grid {
            grid-template-columns: 1fr;
        }

        .network-info {
            grid-template-columns: 1fr;
        }

        footer {
            flex-direction: column;

            gap: 15px;
        }
    }

    /* =========================小屏手机========================= */

    @media (max-width: 420px) {

        nav .logo {
            font-size: 15px;

            letter-spacing: 3px;
        }

        nav a {
            margin-left: 8px;

            font-size: 9px;

            letter-spacing: 0.5px;
        }

        .hero {
            padding-left: 5%;
            padding-right: 5%;
        }

        h1 {
            font-size: clamp(55px, 20vw, 90px);
        }

        .speed-panel {
            padding: 14px;
        }

        .speed-card {
            padding: 20px;
        }

        .speed-value {
            font-size: 46px;
        }
    }

    /* =========================无障碍 / 省电========================= */

    @media (prefers-reduced-motion: reduce) {

        html {
            scroll-behavior: auto;
        }

        .status-dot {
            animation: none;
        }

        .speed-progress-bar {
            transition: none;
        }

        /* 关闭装饰性光晕，交给 JS 时可通过媒体查询跳过 */
        .glow {
            display: none;
        }
    }
</style>
</head>

<!-- =========================鼠标光晕========================= -->

<script>
"use strict";

/*
 * ============================================================
 *  JERRY // NETWORK DIAGNOSTICS
 *  前端测速脚本：下载 / 上传 / 延迟 / 抖动
 *
 *  对应的后端接口（Cloudflare Worker，见 woker.js）：
 *    GET  /api/speed/ping      返回 "pong"，用于测量延迟
 *    GET  /api/speed/download  持续返回二进制流（服务端最长 20s）
 *    POST /api/speed/upload    读取请求体，返回 { success, bytes }
 *
 *  单位约定：界面显示 Mbps（兆比特每秒），内部统一用「字节数 ÷ 耗时」换算。
 * ============================================================
 */


/* ============================================================
 * 1. 配置
 *    所有可调参数集中在这里，函数内部不再出现魔法数字
 * ============================================================ */

const CONFIG = {

    /* 延迟测试 */
    ping: {
        endpoint: "/api/speed/ping",
        samples: 8,      // 采样次数
        warmUp: 1,       // 前 N 个样本丢弃（包含 DNS / TLS 建连开销）
        timeout: 3000    // 单次请求超时（ms）
    },

    /* 下载测试 */
    download: {
        endpoint: "/api/speed/download",
        duration: 10000, // 测试总时长（ms）
        concurrency: 3   // 并发连接数：单连接通常跑不满带宽
    },

    /* 上传测试 */
    upload: {
        endpoint: "/api/speed/upload",
        duration: 10000,
        concurrency: 2,

        // 数据块越小，统计值越接近「真正写入网络」的字节数，但 CPU 开销更高
        chunkSize: 64 * 1024
    },

    /* 界面刷新间隔：与网络读取解耦，避免每读一块数据就写一次 DOM */
    uiInterval: 100
};


/* ============================================================
 * 2. DOM 引用
 *    只查询一次并缓存，避免在循环里反复 getElementById
 * ============================================================ */

const dom = {
    downloadValue: document.getElementById("downloadValue"),
    downloadProgress: document.getElementById("downloadProgress"),
    downloadButton: document.getElementById("downloadButton"),

    uploadValue: document.getElementById("uploadValue"),
    uploadProgress: document.getElementById("uploadProgress"),
    uploadButton: document.getElementById("uploadButton"),

    latencyValue: document.getElementById("latencyValue"),
    jitterValue: document.getElementById("jitterValue"),
    edgeValue: document.getElementById("edgeValue"),

    speedStatus: document.getElementById("speedStatus")
};


/* ============================================================
 * 3. 运行状态
 *    防止连点导致多个测试同时进行、互相污染统计数据
 * ============================================================ */

const running = {
    ping: false,
    download: false,
    upload: false
};


/* ============================================================
 * 4. 通用工具函数
 * ============================================================ */

/**
 * 给 URL 追加随机参数，绕过浏览器与中间层缓存
 * @param {string} url
 * @returns {string}
 */
function bustCache(url) {
    const separator = url.includes("?") ? "&" : "?";
    return url + separator + "x=" + Math.random().toString(36).slice(2);
}

/**
 * 生成超时用的 AbortSignal
 * 优先使用原生 AbortSignal.timeout()，旧版 Safari 走手动降级实现
 * @param {number} ms
 * @returns {AbortSignal}
 */
function timeoutSignal(ms) {
    if (typeof AbortSignal !== "undefined" &&
        typeof AbortSignal.timeout === "function") {
        return AbortSignal.timeout(ms);
    }

    const controller = new AbortController();
    setTimeout(() => controller.abort(), ms);
    return controller.signal;
}

/**
 * 字节数 + 秒数 → Mbps
 * @param {number} bytes
 * @param {number} seconds
 * @returns {number}
 */
function toMbps(bytes, seconds) {
    if (!(seconds > 0)) return 0;
    return (bytes * 8) / seconds / 1000000;
}

/**
 * 取中位数（比平均值更抗抖动、抗异常样本）
 * @param {number[]} values
 * @returns {number}
 */
function median(values) {
    const sorted = [...values].sort((a, b) => a - b);
    const middle = sorted.length >> 1;

    return sorted.length % 2
        ? sorted[middle]
        : (sorted[middle - 1] + sorted[middle]) / 2;
}

/**
 * 写入底部状态栏
 * @param {string} text
 */
function setStatus(text) {
    /* 内容相同时不写 DOM，减少无谓的样式重算 */
    if (dom.speedStatus.textContent === text) return;
    dom.speedStatus.textContent = text;
}

/**
 * 更新进度条（ratio 会被限制在 0 ~ 1）
 * @param {HTMLElement} element
 * @param {number} ratio
 */
function setProgress(element, ratio) {
    const clamped = Math.min(1, Math.max(0, ratio));
    const width = (clamped * 100).toFixed(1) + "%";

    /* 宽度没变化就跳过赋值，避免触发样式失效 */
    if (element.style.width === width) return;
    element.style.width = width;
}

/**
 * 切换按钮的忙碌状态
 * @param {HTMLButtonElement} button
 * @param {boolean} busy
 * @param {string} idleText
 */
function setBusy(button, busy, idleText) {
    button.disabled = busy;
    button.textContent = busy ? "TESTING..." : idleText;
}

/**
 * 从 cf-ray 响应头解析 Cloudflare 边缘节点代码
 * 形如 "8a1b2c3d4e5f6a7b-NRT"，最后一段即边缘机房代码
 * @param {Response} response
 */
function updateEdge(response) {
    const ray = response.headers.get("cf-ray");
    if (!ray) return;

    const colo = ray.split("-").pop();
    if (colo && /^[A-Z]{3}$/.test(colo)) {
        dom.edgeValue.textContent = colo;
    }
}

/**
 * 汇总失败原因，便于排查（接口未部署 / 被拦截 / 服务端报错等）
 * @param {PromiseSettledResult<unknown>[]} results
 * @param {string} label
 */
function reportFailure(results, label) {
    results
        .filter((result) => result.status === "rejected")
        .slice(0, 1)
        .forEach((result) => {
            console.error(label + " failed:", result.reason);
        });
}


/* ============================================================
 * 5. 延迟 / 抖动测试
 * ============================================================ */

/**
 * 连续发起若干次小请求并统计往返时间
 * - 延迟：取样本中位数
 * - 抖动：相邻样本差值的平均值（RFC 3550 的简化形式）
 * @returns {Promise<{latency: number, jitter: number}|null>} 无有效样本时返回 null
 */
async function testPing() {

    if (running.ping) return null;
    running.ping = true;

    const samples = [];

    for (let i = 0; i < CONFIG.ping.samples; i++) {

        const startedAt = performance.now();

        try {
            const response = await fetch(bustCache(CONFIG.ping.endpoint), {
                cache: "no-store",
                signal: timeoutSignal(CONFIG.ping.timeout)
            });

            /* 必须把 body 读完，否则连接不会被立即回收 */
            await response.arrayBuffer();

            /* 顺便取一次边缘节点信息（同源请求可以读到 cf-ray） */
            updateEdge(response);

            /* 第一个样本包含建连 / TLS 握手，不计入统计 */
            if (i >= CONFIG.ping.warmUp) {
                samples.push(performance.now() - startedAt);
            }

        } catch (error) {
            /* 单个样本失败不影响其余样本 */
            console.warn("ping sample failed:", error);
        }
    }

    running.ping = false;

    if (!samples.length) {
        dom.latencyValue.textContent = "--";
        dom.jitterValue.textContent = "--";
        return null;
    }

    const latency = median(samples);

    let differenceSum = 0;
    for (let i = 1; i < samples.length; i++) {
        differenceSum += Math.abs(samples[i] - samples[i - 1]);
    }

    const jitter = samples.length > 1
        ? differenceSum / (samples.length - 1)
        : 0;

    dom.latencyValue.textContent = Math.round(latency);
    dom.jitterValue.textContent = Math.round(jitter);

    return { latency, jitter };
}


/* ============================================================
 * 6. 测速通用流程
 *    下载与上传的「置忙 → 定时刷新界面 → 并发连接 → 汇总结果」完全一致，
 *    抽成一份，两个测试只负责提供数据来源与连接方式
 * ============================================================ */

/**
 * 执行一次测速
 *
 * @param {object} options
 * @param {HTMLButtonElement} options.button          触发的按钮
 * @param {HTMLElement} options.valueElement          数值元素
 * @param {HTMLElement} options.progressElement       进度条元素
 * @param {string} options.idleText                   按钮空闲文案
 * @param {string} options.label                      状态栏前缀（DOWNLOAD / UPLOAD）
 * @param {number} options.duration                   测试时长（ms）
 * @param {string} options.emptyMessage               没有数据时的提示
 * @param {() => number} options.measure              读取当前累计字节数
 * @param {(signal: AbortSignal) => Promise<unknown>[]} options.start 启动全部连接
 */
async function runSpeedTest(options) {

    const {
        button, valueElement, progressElement,
        idleText, label, duration, emptyMessage,
        measure, start
    } = options;

    setBusy(button, true, idleText);
    valueElement.textContent = "0.0";
    setProgress(progressElement, 0);
    setStatus(label + " // INITIALIZING");

    const controller = new AbortController();
    const startedAt = performance.now();

    /* 到时间统一中止：一个 AbortController 可以同时终止所有并发请求 */
    const stopTimer = setTimeout(() => controller.abort(), duration);

    /* 界面刷新交给定时器，与网络读取解耦 */
    const uiTimer = setInterval(() => {
        const elapsed = (performance.now() - startedAt) / 1000;
        const mbps = toMbps(measure(), elapsed).toFixed(1);

        valueElement.textContent = mbps;
        setProgress(progressElement, (elapsed * 1000) / duration);
        setStatus(label + " // " + mbps + " Mbps");
    }, CONFIG.uiInterval);

    /* 用 allSettled：被 abort 的连接会 reject，属于预期情况 */
    const results = await Promise.allSettled(start(controller.signal));

    clearTimeout(stopTimer);
    clearInterval(uiTimer);

    const elapsed = (performance.now() - startedAt) / 1000;
    const bytes = measure();
    const mbps = toMbps(bytes, elapsed);

    setBusy(button, false, idleText);

    if (bytes > 0) {
        valueElement.textContent = mbps.toFixed(1);
        setProgress(progressElement, 1);
        setStatus(label + " // COMPLETE // " + mbps.toFixed(1) + " Mbps");
    } else {
        setStatus(label + " // ERROR // " + emptyMessage);
        reportFailure(results, label.toLowerCase());
    }
}


/* ============================================================
 * 7. 下载测试
 * ============================================================ */

/**
 * 下载测速：并发若干条连接，统计测试时长内读到的总字节数
 */
async function testDownload() {

    if (running.download) return;
    running.download = true;

    /* 所有连接共享的总字节数，由 downloadStream 的回调累加 */
    let bytes = 0;

    await runSpeedTest({
        button: dom.downloadButton,
        valueElement: dom.downloadValue,
        progressElement: dom.downloadProgress,
        idleText: "TEST DOWNLOAD",
        label: "DOWNLOAD",
        duration: CONFIG.download.duration,
        emptyMessage: "未收到数据",

        measure: () => bytes,

        /* 启动并发连接，等待与中止都交给通用流程 */
        start: (signal) => {
            const connections = [];

            for (let i = 0; i < CONFIG.download.concurrency; i++) {
                connections.push(
                    downloadStream(signal, (chunkBytes) => {
                        bytes += chunkBytes;
                    })
                );
            }

            return connections;
        }
    });

    running.download = false;

    /* 下载结束后重测一次延迟：带宽被占满时延迟会明显变化 */
    await testPing();
}

/**
 * 单条下载连接：持续读取响应流，直到被中止或服务端主动结束
 * @param {AbortSignal} signal
 * @param {(bytes: number) => void} onBytes 每读到一块数据时回调
 */
async function downloadStream(signal, onBytes) {

    const response = await fetch(bustCache(CONFIG.download.endpoint), {
        cache: "no-store",
        signal
    });

    if (!response.ok || !response.body) {
        throw new Error("download HTTP " + response.status);
    }

    const reader = response.body.getReader();

    try {
        for (;;) {
            const { value, done } = await reader.read();

            if (done) break;
            if (value) onBytes(value.byteLength);
        }
    } finally {
        /* 释放流；被 abort 时抛出的 AbortError 由 allSettled 兜住 */
        try {
            await reader.cancel();
        } catch (error) {
            /* 流已关闭，无需处理 */
        }
    }
}


/* ============================================================
 * 8. 上传测试
 * ============================================================ */

/**
 * 上传测速：并发若干条流式上传连接，统计测试时长内被网络层取走的数据量
 *
 * 说明：浏览器没有「已发送字节数」的公开接口，这里统计的是流被消费的字节数。
 *      ReadableStream 默认队列策略的缓冲上限是 1 块，因此 pull() 被调用即说明
 *      上一块已经被消费，统计误差被限制在 1 个数据块以内。
 */
async function testUpload() {

    if (running.upload) return;
    running.upload = true;

    /* 所有连接复用同一块只读数据，避免反复分配内存 */
    const chunk = new Uint8Array(CONFIG.upload.chunkSize);

    /* 每条连接一个独立计数器，汇总时相加 */
    const channels = [];
    for (let i = 0; i < CONFIG.upload.concurrency; i++) {
        channels.push({ stopped: false, bytes: 0 });
    }

    const totalBytes = () =>
        channels.reduce((sum, channel) => sum + channel.bytes, 0);

    await runSpeedTest({
        button: dom.uploadButton,
        valueElement: dom.uploadValue,
        progressElement: dom.uploadProgress,
        idleText: "TEST UPLOAD",
        label: "UPLOAD",
        duration: CONFIG.upload.duration,
        emptyMessage: "未发送数据",

        measure: totalBytes,

        /* 启动并发连接，等待与中止都交给通用流程 */
        start: (signal) => channels.map((channel) =>
            uploadStream(channel, chunk, signal)
        )
    });

    running.upload = false;

    await testPing();
}

/**
 * 单条上传连接
 * @param {{stopped: boolean, bytes: number}} channel 该连接的流量计数器
 * @param {Uint8Array} chunk 复用的数据块
 * @param {AbortSignal} signal
 */
async function uploadStream(channel, chunk, signal) {

    /*
     * pull() 只在下游需要更多数据时被调用 —— 天然背压，
     * 不会把待发送数据全部堆在内存里。
     */
    const body = new ReadableStream({
        pull(controller) {
            if (channel.stopped || signal.aborted) {
                controller.close();
                return;
            }

            controller.enqueue(chunk);
            channel.bytes += chunk.byteLength;
        },
        cancel() {
            channel.stopped = true;
        }
    });

    try {
        const response = await fetch(CONFIG.upload.endpoint, {
            method: "POST",
            body,
            /* 流式请求体必须声明半双工 */
            duplex: "half",
            signal,
            headers: {
                "Content-Type": "application/octet-stream",
                "Cache-Control": "no-cache"
            }
        });

        /* 服务器返回 { success, bytes }，读掉 body 让请求正常结束 */
        await response.arrayBuffer();

    } catch (error) {
        /* 测试结束时主动 abort 属于预期行为，不当作错误 */
        if (!signal.aborted) {
            console.error("upload stream failed:", error);
        }
    } finally {
        channel.stopped = true;
    }
}


/* ============================================================
 * 9. 鼠标光晕
 * ============================================================ */

/**
 * 用 rAF 节流 + transform 移动光晕
 * 直接改 left / top 会让每次 mousemove 都触发布局计算
 */
function initGlow() {

    const glow = document.getElementById("glow");
    if (!glow) return;

    /* 没有鼠标的设备直接跳过 */
    if (!window.matchMedia("(hover: hover)").matches) return;

    let x = 0;
    let y = 0;
    let scheduled = false;

    function render() {
        scheduled = false;
        glow.style.transform =
            "translate3d(" + x + "px, " + y + "px, 0) translate(-50%, -50%)";
    }

    window.addEventListener("mousemove", (event) => {
        x = event.clientX;
        y = event.clientY;

        /* 每帧最多写一次样式 */
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(render);
    }, { passive: true });
}


/* ============================================================
 * 10. 初始化
 * ============================================================ */

function init() {
    dom.downloadButton.addEventListener("click", testDownload);
    dom.uploadButton.addEventListener("click", testUpload);

    initGlow();

    /*
     * 自动测延迟放在 load 之后：
     * 避免测速请求与首屏内容抢带宽 / 连接，加快首屏呈现
     */
    if (document.readyState === "complete") {
        testPing();
    } else {
        window.addEventListener("load", testPing, { once: true });
    }
}

/* 脚本位于 body 末尾，正常情况下 DOM 已经解析完成 */
if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init, { once: true });
} else {
    init();
}

</script>
