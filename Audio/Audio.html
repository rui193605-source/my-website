<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121614">

  <title>REACTOR — 声场反应堆</title>
  <meta name="description" content="让音乐驱动堆芯。基于控制棒阵列的实时音频可视化。">

  <!-- 站点图标：内联 SVG，省去一次请求 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121614'/%3E%3Cpath d='M7 23V15h4v8m3 0V6h4v17m3 0V11h4v12' stroke='%23dded84' stroke-width='3'/%3E%3C/svg%3E">

  <!-- 样式表 -->
  <link rel="stylesheet" href="Audiostyle.css">
</head>
<body>

  <!-- ==================== 顶栏 ==================== -->
  <header>
    <!-- 品牌 -->
    <a class="brand" href="./">
      <span class="brand-icon">▦</span>
      REACTOR
    </a>

    <!-- 全屏开关（文案由 JS 更新） -->
    <button id="fullscreen" class="plain">全屏 ↗</button>
  </header>

  <main>
    <!-- ==================== 左：舞台 ==================== -->
    <section class="stage">

      <!-- 标题区 -->
      <div class="stage-title">
        <div class="eyebrow">REAL-TIME AUDIO VISUALIZER</div>
        <h1>声场反应堆<span> / CORE 01</span></h1>
      </div>

      <!-- 运行状态（文案由 JS 更新） -->
      <div class="live">
        <i></i>
        <span id="status">待机 · 麦克风输入</span>
      </div>

      <!-- 主画布：控制棒阵列（由 app.js 绘制） -->
      <canvas id="core" aria-label="圆形控制棒阵列，随音频频谱起伏的三维可视化"></canvas>

      <!-- 阵列通道数（由 JS 写入实际数量） -->
      <div class="axis top">CONTROL ROD ARRAY · <span id="count">709</span> CHANNELS</div>

      <!-- 操作提示 + 视角重置 -->
      <div class="stage-bottom">
        <span>↔ 拖动旋转视角 <span class="desktop"> / 滚轮缩放</span><span class="mobile"> / 双指缩放</span></span>
        <button id="reset" class="plain">重置视角 ⤾</button>
      </div>

      <!-- 振幅色标 -->
      <div class="scale">
        <span>振幅</span>
        <div></div>
        <span>高</span>
        <span>低</span>
      </div>
    </section>

    <!-- ==================== 右：控制台 ==================== -->
    <aside>

      <!-- 面板标题 -->
      <div class="panel-title">
        <span>控制台</span>
        <span class="eyebrow">CONTROL PANEL</span>
      </div>

      <!-- ---------- 01 / 音频输入 ---------- -->
      <section class="source">
        <label class="caption">01 / 音频输入</label>

        <!-- 输入源：仅麦克风 -->
        <div class="source-tabs">
          <button id="mic" class="selected">麦克风</button>
        </div>

        <!-- 本地文件导入（真正触发的是隐藏的 #file） -->
        <button id="upload" class="upload">
          <span>＋</span>
          <strong>导入音频文件</strong>
          <small>MP3 / WAV / M4A / FLAC</small>
        </button>
        <input id="file" type="file" accept="audio/*" hidden>
      </section>

      <!-- ---------- 02 / 控制棒响应 ---------- -->
      <section>
        <label class="caption">02 / 控制棒响应</label>

        <!-- 灵敏度 -->
        <div class="slider-title">
          <label for="gain">灵敏度</label>
          <output id="gainval">1.4×</output>
        </div>
        <input id="gain" type="range" min="0.3" max="3" value="1.4" step="0.1">

        <!-- 运动平滑度 -->
        <div class="slider-title">
          <label for="smooth">运动平滑度</label>
          <output id="smoothval">75%</output>
        </div>
        <input id="smooth" type="range" min="0" max="95" value="75">

        <!-- 播放音量 -->
        <div class="slider-title">
          <label for="volume">播放音量</label>
          <output id="volumeval">40%</output>
        </div>
        <input id="volume" type="range" min="0" max="100" value="40">

        <!-- 频段分布图例 -->
        <div class="slider-title">
          <span>频段分布</span>
          <span class="subtle">中心 → 边缘</span>
        </div>
        <div class="legend">
          <span><i class="low"></i>低频</span>
          <span><i class="mid"></i>中频</span>
          <span><i class="high"></i>高频</span>
        </div>
      </section>

      <!-- ---------- 03 / 实时读数 ---------- -->
      <section class="readings">
        <label class="caption">03 / 实时读数</label>

        <div class="meters">
          <div>
            <span>输入电平</span>
            <strong id="level">—<small>dB</small></strong>
          </div>
          <div>
            <span>峰值频率</span>
            <strong id="freq">—<small>Hz</small></strong>
          </div>
        </div>

        <canvas id="spectrum" aria-label="实时频谱"></canvas>
      </section>

      <!-- 状态提示 -->
      <p id="message" role="status">音频仅在本机处理，不会上传。</p>
    </aside>
  </main>

  <!-- 脚本放在最后，确保 DOM 已就绪 -->
  <script src="Audioapp.js"></script>
</body>
</html>
