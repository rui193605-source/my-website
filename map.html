<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>位置查看</title>


 <!--外部地图-->
 <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        background: #05070a;
        color: #e8edf2;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Microsoft YaHei",
            sans-serif;
        overflow-x: hidden;
    }

    .glow {
        position: fixed;
        width: 380px;
        height: 380px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(
            circle,
            rgba(108, 255, 155, 0.12),
            rgba(108, 255, 155, 0.04) 28%,
            transparent 72%
        );
        filter: blur(30px);
        opacity: 0.9;
        z-index: 0;
    }

    /* =========================背景网格========================= */

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.16;

        background-image:
            linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);

        background-size: 45px 45px;

        mask-image: linear-gradient(
            to bottom,
            black,
            transparent 85%
        );

        -webkit-mask-image: linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
    }

    /* =========================顶部导航========================= */

    nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;

        height: 70px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 7%;

        background: rgba(5,7,10,0.72);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        border-bottom: 1px solid rgba(255,255,255,0.08);

        z-index: 10;
    }

    .logo {
        font-weight: 800;
        letter-spacing: 4px;
        font-size: 18px;
    }

    .logo span {
        opacity: 0.45;
    }

    nav a {
        color: #aeb8c2;
        text-decoration: none;
        margin-left: 28px;
        font-size: 13px;
        letter-spacing: 1px;
        transition: 0.25s;
    }

    nav a:hover {
        color: white;
    }

    /* =========================主区域========================= */

    .hero {
        min-height: 100vh;

        display: flex;
        align-items: center;

        padding: 120px 8% 100px;

        position: relative;
    }

    .hero-content {
        width: 100%;
        max-width: 1000px;
        margin: auto;
    }

    .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;

        padding: 8px 13px;

        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;

        background: rgba(255,255,255,0.035);

        color: #9ca7b2;

        font-size: 12px;
        letter-spacing: 1px;
    }

    .status-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #6cff9b;

        box-shadow:
            0 0 10px #6cff9b;

        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%,100% {
            opacity: 0.45;
        }

        50% {
            opacity: 1;
        }
    }

    h1 {
        margin: 25px 0 10px;

        font-size: clamp(55px, 10vw, 120px);

        line-height: 0.9;

        letter-spacing: -6px;

        font-weight: 900;

        background: linear-gradient(
            120deg,
            #ffffff,
            #9aa6b2
        );

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;
    }

    .subtitle {
        font-size: clamp(17px, 2vw, 25px);

        color: #9da8b3;

        margin-top: 30px;

        margin-bottom: 45px;
    }

    /* =========================查询面板========================= */
    .lookup-panel {
        width: 100%;

        border: 1px solid rgba(255,255,255,0.10);

        background: rgba(255,255,255,0.035);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        padding: 28px;

        box-shadow:
            0 0 40px rgba(108,255,155,0.025);
    }

    .panel-label {
        color: #6cff9b;

        font-family: monospace;

        font-size: 12px;

        letter-spacing: 2px;

        margin-bottom: 12px;
    }

    .search-row {
        display: flex;
        gap: 10px;
    }

    .search-input {
        flex: 1;

        min-width: 0;

        height: 52px;

        padding: 0 17px;

        border: 1px solid rgba(255,255,255,0.10);

        background: rgba(0,0,0,0.25);

        color: white;

        outline: none;

        font-size: 15px;

        font-family: inherit;

        transition: 0.25s;
    }

    .search-input:focus {
        border-color: rgba(108,255,155,0.55);

        box-shadow:
            0 0 20px rgba(108,255,155,0.06);
    }

    .search-input::placeholder {
        color: #66717c;
    }

    .search-button {
        height: 52px;

        padding: 0 24px;

        border: 1px solid rgba(108,255,155,0.35);

        background: rgba(108,255,155,0.08);

        color: #6cff9b;

        font-family: monospace;

        font-weight: 700;

        letter-spacing: 1px;

        cursor: pointer;

        transition: 0.25s;
    }

    .search-button:hover {
        background: rgba(108,255,155,0.16);

        border-color: #6cff9b;
    }

    .search-button:disabled {
        opacity: 0.45;

        cursor: wait;
    }

    /* =========================查询结果========================= */

    .results {
        margin-top: 22px;

        display: none;
    }

    /* =========================地图========================= */
    .map-container {
        margin-top: 18px;

        width: 100%;

        height: 520px;

        border: 1px solid rgba(255,255,255,0.10);

        overflow: hidden;

        background: #e9e9e9;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    /* Leaflet 控件稍微调整 */

    .leaflet-control-zoom a {
        color: #222 !important;
    }

    .leaflet-control-attribution {
        font-size: 9px;
    }


    .result-card {
        border-top: 1px solid rgba(255,255,255,0.08);

        padding-top: 22px;
    }

    .result-navigation {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid rgba(255,255,255,0.08);
    }

    .result-nav-button {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.04);
        color: #e8edf2;
        font-size: 18px;
        cursor: pointer;
        transition: 0.25s;
    }

    .result-nav-button:hover:not(:disabled) {
        border-color: rgba(108,255,155,0.5);
        background: rgba(108,255,155,0.08);
        color: #6cff9b;
    }

    .result-nav-button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
    }

    .result-counter {
        min-width: 80px;
        text-align: center;
        color: #b9c3cc;
        font-family: monospace;
        font-size: 13px;
        letter-spacing: 1px;
    }

    .result-name {
        font-size: 22px;

        font-weight: 700;

        color: white;

        margin-bottom: 7px;
    }

    .result-address {
        color: #77828d;

        font-size: 13px;

        line-height: 1.7;

        margin-bottom: 25px;
    }

    .data-grid {
        display: grid;

        grid-template-columns:
            repeat(4, 1fr);

        gap: 10px;
    }

    .data-box {
        border: 1px solid rgba(255,255,255,0.07);

        background: rgba(0,0,0,0.18);

        padding: 17px;
    }

    .data-label {
        color: #68737e;

        font-family: monospace;

        font-size: 10px;

        letter-spacing: 1.5px;

        margin-bottom: 9px;
    }

    .data-value {
        color: #e8edf2;

        font-family: monospace;

        font-size: 15px;

        word-break: break-word;
    }

    .coordinates {
        color: #6cff9b;
    }

    /* =========================
       反向解析
    ========================= */

    .reverse-section {
        margin-top: 18px;

        padding-top: 22px;

        border-top: 1px solid rgba(255,255,255,0.08);
    }

    .reverse-title {
        color: #89949f;

        font-family: monospace;

        font-size: 12px;

        letter-spacing: 1.5px;

        margin-bottom: 12px;
    }

    .reverse-row {
        display: flex;

        gap: 10px;
    }

    .coordinate-input {
        width: 100%;

        height: 46px;

        padding: 0 14px;

        border: 1px solid rgba(255,255,255,0.08);

        background: rgba(0,0,0,0.25);

        color: white;

        outline: none;

        font-family: monospace;

        font-size: 13px;
    }

    .reverse-button {
        flex-shrink: 0;

        height: 46px;

        padding: 0 18px;

        border: 1px solid rgba(255,255,255,0.12);

        background: rgba(255,255,255,0.04);

        color: #b9c3cc;

        cursor: pointer;

        font-family: monospace;

        transition: 0.25s;
    }

    .reverse-button:hover {
        color: white;

        border-color: rgba(255,255,255,0.3);

        background: rgba(255,255,255,0.08);
    }

    /* =========================
       状态信息
    ========================= */

    .message {
        margin-top: 18px;

        color: #77828d;

        font-family: monospace;

        font-size: 12px;

        display: none;
    }

    .message.error {
        color: #ff7f7f;
    }

    /* =========================
       页脚
    ========================= */

    footer {
        padding: 80px 8% 40px;

        color: #ffffff;

        font-family: monospace;

        font-size: 17px;

        font-weight: 700;

        display: flex;

        justify-content: space-between;

        border-top:
            1px solid rgb(255,255,255);
    }

    /* =========================
       手机端
    ========================= */

    @media (max-width: 700px) {

        nav {
            padding: 0 5%;
        }

        nav a {
            margin-left: 12px;

            font-size: 11px;
        }

        .hero {
            min-height: auto;

            padding:
                110px 6% 90px;
        }

        h1 {
            letter-spacing: -4px;
        }

        .lookup-panel {
            padding: 20px;
        }

        .search-row {
            flex-direction: column;
        }

        .search-button {
            width: 100%;
        }

        .data-grid {
            grid-template-columns:
                repeat(2, 1fr);
        }

        .reverse-row {
            flex-direction: column;
        }

        .reverse-button {
            width: 100%;
        }

        footer {
            flex-direction: column;

            gap: 15px;
        }
    }

    /* =========================
       小屏手机
    ========================= */

    @media (max-width: 420px) {

        nav .logo {
            font-size: 15px;

            letter-spacing: 3px;
        }

        nav a {
            margin-left: 8px;

            font-size: 9px;

            letter-spacing: 0.5px;
        }

        .hero {
            padding-left: 5%;
            padding-right: 5%;
        }

        h1 {
            font-size: clamp(
                48px,
                18vw,
                80px
            );
        }

        .lookup-panel {
            padding: 16px;
        }

        .data-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<main class="hero">

<!-- =========================

========================= -->

<div class="lookup-panel">

    <div class="panel-label">

    </div>


    <div class="search-row">

        <input
            id="searchInput"

            type="text"

<script>

    /* =========================
       鼠标光晕
    ========================= */

    const glow =
        document.getElementById("glow");

    if (glow) {

        document.addEventListener(
            "mousemove",
            (event) => {

                glow.style.left =
                    event.clientX + "px";

                glow.style.top =
                    event.clientY + "px";

            }
        );

    }


    /* =========================
       DOM
    ========================= */

    const searchInput =
        document.getElementById("searchInput");

    const searchButton =
        document.getElementById("searchButton");

    const results =
        document.getElementById("results");

    const message =
        document.getElementById("message");

    const resultName =
        document.getElementById("resultName");

    const resultAddress =
        document.getElementById("resultAddress");

    const resultNavigation =
        document.getElementById("resultNavigation");

    const resultCounter =
        document.getElementById("resultCounter");

    const previousResult =
        document.getElementById("previousResult");

    const nextResult =
        document.getElementById("nextResult");

    const latitude =
        document.getElementById("latitude");

    const longitude =
        document.getElementById("longitude");

    const elevation =
        document.getElementById("elevation");

    const timezone =
        document.getElementById("timezone");

    /* =========================
    Leaflet 地图
    ========================= */

    let map = null;
    let mapMarker = null;

    /* =========================
    初始化地图
    ========================= */

    function initMap() {

        map = L.map("map", {
            zoomControl: true,
            attributionControl: true
        }).setView(
            [35.6584491, 139.745536],
            13
        );

        /* 白色标准地图 */
        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

    }

    /* =========================
    更新地图位置
    ========================= */

    function updateMap(
        lat,
        lon,
        zoom = 15
    ) {

        if (!map) {
            return;
        }

        const latitude =
            Number(lat);

        const longitude =
            Number(lon);

        if (
            !Number.isFinite(latitude) ||
            !Number.isFinite(longitude)
        ) {
            return;
        }

        map.setView(
            [latitude, longitude],
            zoom,
            {
                animate: true
            }
        );

        /* 第一次创建标记 */
        if (!mapMarker) {

            mapMarker =
                L.marker(
                    [latitude, longitude]
                ).addTo(map);

        } else {

            /* 后续直接移动标记 */
            mapMarker.setLatLng(
                [latitude, longitude]
            );

        }

    }

    /* =========================
       消息
    ========================= */

    function showMessage(
        text,
        error = false
    ) {

        message.textContent = text;

        message.className =
            error
                ? "message error"
                : "message";

        message.style.display =
            "block";

    }


    function hideMessage() {

        message.style.display =
            "none";

    }

    const searchResults = [];

    let currentResultIndex = 0;

    /* =========================
       结果导航
    ========================= */
    function updateResultNavigation() {

        const total = searchResults.length;

        resultNavigation.style.display = "flex";

        resultCounter.textContent =
            `${currentResultIndex + 1} / ${total}`;

        previousResult.disabled =
            total <= 1 || currentResultIndex === 0;

        nextResult.disabled =
            total <= 1 || currentResultIndex === total - 1;

    }

    function showResultAtIndex(index) {

        if (
            searchResults.length === 0
        ) {

            return;

        }

        const boundedIndex =
            Math.min(
                Math.max(index, 0),
                searchResults.length - 1
            );

        currentResultIndex = boundedIndex;

        const place =
            searchResults[boundedIndex];

        displayResult(place);

        updateResultNavigation();

        if (
            Number.isFinite(
                Number(place.latitude)
            ) &&
            Number.isFinite(
                Number(place.longitude)
            )
        ) {

            loadPlaceDetails(place);

        }

    }

    /* =========================
   地点详细信息缓存
========================= */
const placeDetailsCache = new Map();

/* =========================
   加载地点详细信息
========================= */

async function loadPlaceDetails(place) {

    const lat =
        Number(place.latitude);

    const lon =
        Number(place.longitude);

    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    ) 
        return;
    }

    /* =========================
       使用坐标作为缓存 Key
    ========================= */

    const cacheKey =
        `${lat},${lon}`;

    /* =========================
       如果已经请求过
       直接使用缓存
    ========================= */

    if (
        placeDetailsCache.has(cacheKey)
    ) {

        const detail =
            placeDetailsCache.get(cacheKey);

        elevation.textContent =
            detail.elevation !== null &&
            detail.elevation !== undefined
                ? `${detail.elevation} m`
                : "—";

        timezone.textContent =
            formatTimezone(
                detail.timezone
            );

        return;

    }

    /* =========================
       防止相同请求同时发送
    ========================= */

    const pendingKey =
        `${cacheKey}:pending`;


    if (
        placeDetailsCache.has(
            pendingKey
        )
    ) {

        try {

            const detail =
                await placeDetailsCache.get(
                    pendingKey
                );

            elevation.textContent =
                detail.elevation !== null &&
                detail.elevation !== undefined
                    ? `${detail.elevation} m`
                    : "—";

            timezone.textContent =
                formatTimezone(
                    detail.timezone
                );

        } catch (error) {

            console.error(
                "Location detail error:",
                error
            );

        }

        return;

    }

    /* =========================
       创建请求 Promise
       放进缓存
       ========================= */

    const requestPromise =
        fetch(
            `/api/location?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`,
            {
                cache: "no-store"
            }
        )
        .then(
            async (response) => {

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                return await response.json();

            }
        );

    placeDetailsCache.set(
        pendingKey,
        requestPromise
    );

    try {

        const detail =
            await requestPromise;

        /* =========================
           保存最终结果
        ========================= */

        placeDetailsCache.set(
            cacheKey,
            detail
        );

        /* =========================
           删除 pending
        ========================= */

        placeDetailsCache.delete(
            pendingKey
        );

        /* =========================
           更新当前显示
        ========================= */

        elevation.textContent =
            detail.elevation !== null &&
            detail.elevation !== undefined
                ? `${detail.elevation} m`
                : "—";

        timezone.textContent =
            formatTimezone(
                detail.timezone
            );

    } catch (detailError) {

        placeDetailsCache.delete(
            pendingKey
        );

        console.error(
            "Location detail error:",
            detailError
        );
    }



    /* =========================
       坐标显示
    ========================= */

    function formatLatitude(value) {

        const lat =
            Number(value);

        if (
            !Number.isFinite(lat) ||
            lat < -90 ||
            lat > 90
        ) {

            return "—";

        }

        const direction =
            lat >= 0
                ? "N"
                : "S";

        return (
            Math.abs(lat).toFixed(5) +
            "° " +
            direction
        );

    }


    function formatLongitude(value) {

        const lon =
            Number(value);

        if (
            !Number.isFinite(lon) ||
            lon < -180 ||
            lon > 180
        ) {

            return "—";

        }

        const direction =
            lon >= 0
                ? "E"
                : "W";

        return (
            Math.abs(lon).toFixed(5) +
            "° " +
            direction
        );

    }


    /* =========================
       显示结果
    ========================= */

    function displayResult(place) {

    resultName.textContent =
        place.name ||
        "Unknown location";

    resultAddress.textContent =
        place.display_name ||
        "No address information";

    const latValue =
        Number(place.latitude);

    const lonValue =
        Number(place.longitude);

    latitude.textContent =
        formatLatitude(latValue);

    longitude.textContent =
        formatLongitude(lonValue);

    elevation.textContent =
        place.elevation !== null &&
        place.elevation !== undefined
            ? `${place.elevation} m`
            : "—";

    timezone.textContent =
        formatTimezone(
            place.timezone
        );

    results.style.display =
        "block";

    /* 地图 */
    if (!map) {
        initMap();
    }

    updateMap(
        latValue,
        lonValue
    );
}

    /* =========================
   通用坐标解析

   支持：

   1. 十进制度
   35.6584491, 139.745536
   35.6584491 139.745536
   -35.6584491, -139.745536

   2. N/S/E/W
   35.6584491 N, 139.745536 E
   35.6584491N 139.745536E
   N35.6584491 E139.745536

   3. DMS
   35°39'30.42"N 139°44'43.93"E

   4. DMS 空格形式
   35 39 30.42 N, 139 44 43.93 E
========================= */

function parseCoordinates(input) {

    if (!input) {
        return null;
    }

    let value = String(input)
        .trim()
        .replace(/[，]/g, ",")
        .replace(/[；;]/g, ",")
        .replace(/[“”″]/g, '"')
        .replace(/[‘’′]/g, "'")
        .replace(/º/g, "°");

    if (!value) {
        return null;
    }


    /* =========================
       辅助函数
    ========================= */

    function validate(lat, lon) {

        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lon)
        ) {
            return null;
        }

        if (
            lat < -90 ||
            lat > 90 ||
            lon < -180 ||
            lon > 180
        ) {
            return null;
        }

        return {
            latitude: lat,
            longitude: lon
        };
    }


    function convertDMS(
        degrees,
        minutes,
        seconds,
        direction
    ) {

        degrees = Number(degrees);
        minutes = Number(minutes || 0);
        seconds = Number(seconds || 0);

        if (
            !Number.isFinite(degrees) ||
            !Number.isFinite(minutes) ||
            !Number.isFinite(seconds)
        ) {
            return null;
        }

        if (
            minutes < 0 ||
            minutes >= 60 ||
            seconds < 0 ||
            seconds >= 60
        ) {
            return null;
        }

        let decimal =
            Math.abs(degrees) +
            minutes / 60 +
            seconds / 3600;

        const dir =
            String(direction || "")
                .toUpperCase();

        if (
            dir === "S" ||
            dir === "W"
        ) {
            decimal = -decimal;
        }

        return decimal;
    }


    /* =========================
       ① DMS

       35°39'30.42"N
       139°44'43.93"E
    ========================= */

    const dmsPattern =
        /^\s*(?:([NS])\s*)?(\d+(?:\.\d+)?)\s*°\s*(\d+(?:\.\d+)?)?\s*['′]?\s*(\d+(?:\.\d+)?)?\s*["″]?\s*([NS])?\s*(?:,|\s)+\s*(?:([EW])\s*)?(\d+(?:\.\d+)?)\s*°\s*(\d+(?:\.\d+)?)?\s*['′]?\s*(\d+(?:\.\d+)?)?\s*["″]?\s*([EW])?\s*$/i;


    let match =
        value.match(dmsPattern);


    if (match) {

        const latDirection =
            match[1] || match[5] || "";

        const lonDirection =
            match[6] || match[10] || "";

        const lat =
            convertDMS(
                match[2],
                match[3],
                match[4],
                latDirection
            );

        const lon =
            convertDMS(
                match[7],
                match[8],
                match[9],
                lonDirection
            );

        const result =
            validate(lat, lon);

        if (result) {
            return result;
        }
    }


    /* =========================
       ② DMS 空格格式

       35 39 30.42 N
       139 44 43.93 E
    ========================= */

    const dmsSpacePattern =
        /^\s*(?:([NS])\s*)?(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s*([NS])?\s*(?:,|\s)+\s*(?:([EW])\s*)?(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s*([EW])?\s*$/i;


    match =
        value.match(dmsSpacePattern);


    if (match) {

        const latDirection =
            match[1] || match[5] || "";

        const lonDirection =
            match[6] || match[10] || "";

        const lat =
            convertDMS(
                match[2],
                match[3],
                match[4],
                latDirection
            );

        const lon =
            convertDMS(
                match[7],
                match[8],
                match[9],
                lonDirection
            );

        const result =
            validate(lat, lon);

        if (result) {
            return result;
        }
    }


    /* =========================
       ③ 十进制度 + N/S/E/W

       35.6584491 N, 139.745536 E
       35.6584491N 139.745536E
       N35.6584491 E139.745536
    ========================= */

    const decimalDirectionPattern =
        /^\s*(?:([NS])\s*)?([+-]?\d+(?:\.\d+)?)\s*([NS])?\s*(?:,|\s)+\s*(?:([EW])\s*)?([+-]?\d+(?:\.\d+)?)\s*([EW])?\s*$/i;


    match =
        value.match(
            decimalDirectionPattern
        );


    if (match) {

        const latDirection =
            match[1] || match[3] || "";

        const lonDirection =
            match[4] || match[6] || "";

        let lat =
            Number(match[2]);

        let lon =
            Number(match[5]);


        if (
            latDirection.toUpperCase() === "S"
        ) {
            lat = -Math.abs(lat);
        } else if (
            latDirection.toUpperCase() === "N"
        ) {
            lat = Math.abs(lat);
        }


        if (
            lonDirection.toUpperCase() === "W"
        ) {
            lon = -Math.abs(lon);
        } else if (
            lonDirection.toUpperCase() === "E"
        ) {
            lon = Math.abs(lon);
        }


        const result =
            validate(lat, lon);

        if (result) {
            return result;
        }
    }


    /* =========================
       ④ 最普通的十进制度

       35.6584491, 139.745536
       35.6584491 139.745536
       -35.6584491 -139.745536
    ========================= */

    const decimalPattern =
        /^\s*([+-]?\d+(?:\.\d+)?)\s*(?:,|\s)\s*([+-]?\d+(?:\.\d+)?)\s*$/;


    match =
        value.match(decimalPattern);


    if (match) {

        const lat =
            Number(match[1]);

        const lon =
            Number(match[2]);

        const result =
            validate(lat, lon);

        if (result) {
            return result;
        }
    }


    /* =========================
       ⑤ 无法识别
    ========================= */

    return null;
}


    /* =========================
       统一搜索
    ========================= */

    async function handleSearch() {

        const input =
            searchInput.value.trim();


        if (!input) {

            showMessage(
                "请输入地点或经纬度",
                true
            );

            return;

        }


        // =========================
        // 尝试识别坐标
        // =========================

        const coordinates =
            parseCoordinates(
            input
        );


        if (coordinates) {

            await reverseLocation(
                coordinates.latitude,
                coordinates.longitude
            );

            return;

        }


        // =========================
        // 否则认为是地点
        // =========================

        await searchLocation(
            input
        );

    }


    /* =========================
       地点 → 坐标
    ========================= */

    async function searchLocation(
        query
    ) {

        searchButton.disabled =
            true;

        searchButton.textContent =
            "SEARCHING...";

        hideMessage();


        try {

            const response =
                await fetch(
                    `/api/geocode?q=${encodeURIComponent(query)}`,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            if (
                !data.results ||
                data.results.length === 0
            ) {

                searchResults.length = 0;
                currentResultIndex = 0;
                resultNavigation.style.display = "none";
                results.style.display = "none";

                showMessage(
                    "没有找到相关地点",
                    true
                );

                return;

            }

            searchResults.length = 0;
            searchResults.push(...data.results);
            currentResultIndex = 0;

            showResultAtIndex(0);

            showMessage(
                `FOUND ${data.count ?? data.results.length} RESULT${(data.count ?? data.results.length) > 1 ? "S" : ""}`
            );


        } catch (error) {

            console.error(
                "Geocode error:",
                error
            );


            results.style.display =
                "none";


            showMessage(
                "查询失败，请稍后再试",
                true
            );


        } finally {

            searchButton.disabled =
                false;

            searchButton.textContent =
                "SEARCH";

        }

    }


    /* =========================坐标 → 地点========================= */

    async function reverseLocation(
        lat,
        lon
    ) {

        searchButton.disabled =
            true;

        searchButton.textContent =
            "RESOLVING...";

        hideMessage();


        try {

            const response =
                await fetch(
                    `/api/reverse?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            displayResult(
                data
            );


            showMessage(
                "COORDINATE RESOLVED"
            );


        } catch (error) {

            console.error(
                "Reverse geocode error:",
                error
            );


            results.style.display =
                "none";


            showMessage(
                "坐标解析失败，请稍后再试",
                true
            );


        } finally {

            searchButton.disabled =
                false;

            searchButton.textContent =
                "SEARCH";

        }

    }


    /* =========================时区格式化========================= */

    function formatTimezone(
        timezone
    ) {

        if (!timezone) {

            return "Unknown";

        }


        try {

            const parts =
                timezone.split("/");


            if (
                parts.length < 2
            ) {

                if (
                    timezone === "UTC" ||
                    timezone === "Etc/UTC"
                ) {

                    return "UTC/0";

                }

                return timezone;

            }


            const continent =
                parts[0];


            const now =
                new Date();


            const formatter =
                new Intl.DateTimeFormat(
                    "en-US",
                    {
                        timeZone:
                            timezone,

                        timeZoneName:
                            "longOffset"
                    }
                );


            const formatted =
                formatter.formatToParts(
                    now
                );


            const offsetPart =
                formatted.find(
                    function (part) {

                        return (
                            part.type ===
                            "timeZoneName"
                        );

                    }
                );


            if (!offsetPart) {

                return timezone;

            }


            let offset =
                offsetPart.value.replace(
                    "GMT",
                    ""
                );


            if (
                offset === "" ||
                offset === "+00:00" ||
                offset === "-00:00"
            ) {

                return (
                    continent +
                    "/0"
                );

            }


            const match =
                offset.match(
                    /([+-])(\d{2}):?(\d{2})?/
                );


            if (!match) {

                return timezone;

            }


            const sign =
                match[1];


            const hours =
                Number(match[2]);


            const minutes =
                match[3]
                    ? Number(match[3])
                    : 0;


            const direction =
                sign === "+"
                    ? "E"
                    : "W";


            if (
                minutes === 0
            ) {

                return (
                    continent +
                    "/" +
                    sign +
                    hours +
                    direction
                );

            }


            return (
                continent +
                "/" +
                sign +
                hours +
                ":" +
                String(minutes)
                    .padStart(
                        2,
                        "0"
                    ) +
                direction
            );


        } catch (error) {

            console.error(
                "Timezone format error:",
                error
            );

            return timezone;

        }

    }


    /* =========================
       SEARCH 按钮
    ========================= */

    previousResult.addEventListener(
        "click",
        () => {

            if (
                currentResultIndex > 0
            ) {

                showResultAtIndex(
                    currentResultIndex - 1
                );

            }

        }
    );


    nextResult.addEventListener(
        "click",
        () => {

            if (
                currentResultIndex <
                searchResults.length - 1
            ) {

                showResultAtIndex(
                    currentResultIndex + 1
                );

            }

        }
    );


    searchButton.addEventListener(
        "click",
        handleSearch
    );


    /* =========================
       Enter 搜索
    ========================= */

    searchInput.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key === "Enter"
            ) {

                handleSearch();

            }

        }
    );
    
</script>
