<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JERRY // CALCULATOR</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;

        background: #05070a;
        color: #e8edf2;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Microsoft YaHei",
            sans-serif;

        overflow-x: hidden;
    }

    /* =========================
       背景网格
       ========================= */

    body::before {
        content: "";

        position: fixed;
        inset: 0;

        pointer-events: none;

        opacity: 0.16;

        background-image:
            linear-gradient(
                rgba(255,255,255,0.06) 1px,
                transparent 1px
            ),
            linear-gradient(
                90deg,
                rgba(255,255,255,0.06) 1px,
                transparent 1px
            );

        background-size: 45px 45px;

        mask-image:
            linear-gradient(
                to bottom,
                black,
                transparent 90%
            );

        -webkit-mask-image:
            linear-gradient(
                to bottom,
                black,
                transparent 90%
            );
    }

    /* =========================
       鼠标光晕
       ========================= */

    .glow {
        position: fixed;

        width: 500px;
        height: 500px;

        border-radius: 50%;

        pointer-events: none;

        background:
            radial-gradient(
                circle,
                rgba(120,150,255,0.10),
                transparent 65%
            );

        transform: translate(-50%, -50%);

        z-index: -1;
    }

    /* =========================
       导航
       ========================= */

    nav {
        position: fixed;

        top: 0;
        left: 0;
        right: 0;

        height: 70px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 7%;

        background: rgba(5,7,10,0.72);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        border-bottom:
            1px solid rgba(255,255,255,0.08);

        z-index: 10;
    }

    .logo {
        font-weight: 800;

        letter-spacing: 4px;

        font-size: 18px;
    }

    .logo span {
        opacity: 0.45;
    }

    nav a {
        color: #aeb8c2;

        text-decoration: none;

        font-size: 13px;

        letter-spacing: 1px;

        transition: 0.25s;
    }

    nav a:hover {
        color: white;
    }

    /* =========================
       主容器
       ========================= */

    main {
        min-height: 100vh;

        padding:
            105px 20px 50px;

        display: flex;

        justify-content: center;

        align-items: flex-start;
    }

    .calculator-page {
        width: min(850px, 100%);
    }

    /* =========================
       标题
       ========================= */

    .page-header {
        text-align: center;

        margin-bottom: 24px;
    }

    .status {
        display: inline-flex;

        align-items: center;

        gap: 8px;

        padding:
            7px 12px;

        border:
            1px solid rgba(255,255,255,0.12);

        border-radius: 999px;

        background:
            rgba(255,255,255,0.035);

        color: #9ca7b2;

        font-family: monospace;

        font-size: 11px;

        letter-spacing: 1px;
    }

    .status-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #6cff9b;

        box-shadow:
            0 0 10px #6cff9b;

        animation: pulse 2s infinite;
    }

    @keyframes pulse {

        0%, 100% {
            opacity: 0.45;
        }

        50% {
            opacity: 1;
        }

    }

    .page-header h1 {
        margin: 18px 0 5px;

        font-size:
            clamp(38px, 7vw, 64px);

        line-height: 1;

        letter-spacing: -3px;

        font-weight: 900;

        background:
            linear-gradient(
                120deg,
                #ffffff,
                #9aa6b2
            );

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;
    }

    .page-header p {
        margin: 0;

        color: #68737e;

        font-family: monospace;

        font-size: 12px;

        letter-spacing: 1px;
    }

    /* =========================
       计算器外壳
       ========================= */

    .calculator {
        background:
            rgba(5,7,10,0.82);

        border:
            1px solid rgba(108,255,155,0.22);

        border-radius: 18px;

        padding: 18px;

        box-shadow:
            0 0 45px rgba(108,255,155,0.045),
            inset 0 0 30px rgba(108,255,155,0.012);

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }

    /* =========================
       显示屏
       ========================= */

    .display {
        position: relative;

        min-height: 110px;

        padding:
            17px 20px;

        margin-bottom: 15px;

        background:
            rgba(255,255,255,0.025);

        border:
            1px solid rgba(255,255,255,0.08);

        border-radius: 12px;

        overflow: hidden;

        display: flex;

        flex-direction: column;

        justify-content: flex-end;
    }

    .display::after {
        content: "";

        position: absolute;

        width: 180px;
        height: 180px;

        right: -90px;
        bottom: -90px;

        border-radius: 50%;

        background:
            rgba(108,255,155,0.055);

        filter: blur(30px);

        pointer-events: none;
    }

    .expression {
        min-height: 22px;

        color: #69747f;

        font-family: monospace;

        font-size: 14px;

        text-align: right;

        white-space: nowrap;

        overflow-x: auto;

        scrollbar-width: none;
    }

    .expression::-webkit-scrollbar {
        display: none;
    }

    .result {
        margin-top: 7px;

        color: #e8edf2;

        font-family: monospace;

        font-size:
            clamp(30px, 6vw, 46px);

        font-weight: 600;

        line-height: 1;

        text-align: right;

        white-space: nowrap;

        overflow-x: auto;

        scrollbar-width: none;
    }

    .result::-webkit-scrollbar {
        display: none;
    }

    /* =========================
       模式栏
       ========================= */

    .mode-bar {
        display: flex;

        align-items: center;

        justify-content: space-between;

        margin-bottom: 12px;

        padding: 0 2px;
    }

    .mode {
        color: #59636d;

        font-family: monospace;

        font-size: 10px;

        letter-spacing: 1px;
    }

    .mode.active {
        color: #6cff9b;
    }

    .ans-display {
        color: #59636d;

        font-family: monospace;

        font-size: 10px;
    }

    /* =========================
       按钮网格
       ========================= */

    .buttons {
        display: grid;

        grid-template-columns:
            repeat(6, 1fr);

        gap: 8px;
    }

    button {
        min-width: 0;

        height: 52px;

        border: 1px solid
            rgba(255,255,255,0.07);

        border-radius: 9px;

        background:
            rgba(255,255,255,0.045);

        color: #c4ccd3;

        font-family: monospace;

        font-size: 14px;

        cursor: pointer;

        transition:
            transform 0.12s,
            background 0.18s,
            border-color 0.18s,
            color 0.18s;

        user-select: none;
    }

    button:hover {
        background:
            rgba(255,255,255,0.08);

        border-color:
            rgba(255,255,255,0.16);

        color: white;
    }

    button:active {
        transform: scale(0.95);

        background:
            rgba(108,255,155,0.12);
    }

    button.function {
        color: #8e9aa5;

        background:
            rgba(255,255,255,0.025);
    }

    button.operator {
        color: #6cff9b;

        background:
            rgba(108,255,155,0.045);

        border-color:
            rgba(108,255,155,0.12);
    }

    button.danger {
        color: #ff8b8b;

        background:
            rgba(255,80,80,0.045);
    }

    button.equal {
        color: #05070a;

        background: #6cff9b;

        border-color: #6cff9b;

        font-weight: 800;
    }

    button.equal:hover {
        background: #8affb0;

        border-color: #8affb0;

        color: #05070a;
    }

    button.zero {
        grid-column: span 2;
    }

    /* =========================
       历史记录
       ========================= */

    .history {
        margin-top: 15px;

        border-top:
            1px solid rgba(255,255,255,0.07);

        padding-top: 15px;
    }

    .history-header {
        display: flex;

        align-items: center;

        justify-content: space-between;

        margin-bottom: 10px;
    }

    .history-title {
        color: #6cff9b;

        font-family: monospace;

        font-size: 11px;

        letter-spacing: 2px;
    }

    .clear-history {
        border: none;

        background: transparent;

        color: #505a64;

        height: auto;

        padding: 3px 5px;

        font-size: 9px;

        letter-spacing: 0.5px;
    }

    .clear-history:hover {
        color: #ff8b8b;

        background: transparent;

        border: none;
    }

    .history-list {
        max-height: 145px;

        overflow-y: auto;

        scrollbar-width: thin;
    }

    .history-empty {
        padding: 10px 0;

        color: #4d5862;

        font-family: monospace;

        font-size: 11px;

        text-align: center;
    }

    .history-item {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 15px;

        padding:
            9px 11px;

        margin-bottom: 5px;

        border-radius: 7px;

        background:
            rgba(255,255,255,0.025);

        cursor: pointer;

        transition: 0.18s;
    }

    .history-item:hover {
        background:
            rgba(108,255,155,0.055);
    }

    .history-expression {
        color: #69747f;

        font-family: monospace;

        font-size: 11px;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;
    }

    .history-result {
        color: #d7dee4;

        font-family: monospace;

        font-size: 12px;

        white-space: nowrap;
    }

    /* =========================
       底部说明
       ========================= */

    .calculator-footer {
        display: flex;

        justify-content: space-between;

        margin-top: 13px;

        color: #3f4851;

        font-family: monospace;

        font-size: 9px;

        letter-spacing: 0.5px;
    }

    /* =========================
       手机端
       ========================= */

    @media (max-width: 650px) {

        nav {
            padding: 0 5%;
        }

        main {
            padding:
                95px 10px 35px;
        }

        .calculator {
            padding: 12px;

            border-radius: 14px;
        }

        .buttons {
            gap: 6px;
        }

        button {
            height: 48px;

            font-size: 12px;
        }

        .display {
            min-height: 100px;

            padding:
                14px 15px;
        }

        .calculator-footer {
            display: none;
        }

    }

    @media (max-width: 420px) {

        nav {
            height: 62px;
        }

        nav a {
            font-size: 10px;
        }

        main {
            padding-top: 82px;
        }

        .page-header {
            margin-bottom: 17px;
        }

        .page-header h1 {
            font-size: 40px;

            letter-spacing: -2px;
        }

        .page-header p {
            font-size: 9px;
        }

        .calculator {
            padding: 9px;
        }

        .buttons {
            gap: 5px;
        }

        button {
            height: 44px;

            font-size: 11px;

            border-radius: 7px;
        }

        .display {
            min-height: 90px;
        }

        .result {
            font-size: 30px;
        }

        .expression {
            font-size: 11px;
        }

        .history-list {
            max-height: 120px;
        }

    }

</style>
</head>

<body>

<div class="glow" id="glow"></div>


<nav>

    <div class="logo">
        JERRY<span> / 2026</span>
    </div>

    <a href="/">
        ← 返回主页
    </a>

</nav>


<main>

    <div class="calculator-page">

        <div class="page-header">

            <div class="status">

                <span class="status-dot"></span>

                CALCULATOR ONLINE

            </div>

            <h1>
                CALCULATOR
            </h1>

            <p>

            </p>

        <div class="calculator">

            <!-- =========================
                 显示屏

                <!-- 第二行 -->

                <button
                    class="function"

                >
                    x²
                </button>

                <button
                    class="function"
                    data-action="cube"
                >
                    x³

                <button

                >

<script>

    /* =========================
       鼠标光晕
       ========================= */

    const glow =
        document.getElementById("glow");

    document.addEventListener(
        "mousemove",
        (event) => {

            glow.style.left =
                event.clientX + "px";

            glow.style.top =
                event.clientY + "px";

        }
    );


    /* =========================
       计算器状态
       ========================= */

    let expression = "";

    let lastResult = 0;

    let memory = 0;

    let angleMode = "DEG";


    const expressionElement =
        document.getElementById("expression");

    const resultElement =
        document.getElementById("result");

    const ansElement =
        document.getElementById("ansValue");

    const historyList =
        document.getElementById("historyList");


    /* =========================
       历史记录
       ========================= */

    let history =
        JSON.parse(
            localStorage.getItem(
                "jerryCalculatorHistory"
            ) || "[]"
        );


    function saveHistory() {

        localStorage.setItem(
            "jerryCalculatorHistory",
            JSON.stringify(history)
        );

    }


    function renderHistory() {

        historyList.innerHTML = "";


        if (history.length === 0) {

            const empty =
                document.createElement("div");

            empty.className =
                "history-empty";

            empty.textContent =
                "No calculations yet.";

            historyList.appendChild(empty);

            return;

        }


        history.forEach(
            (item, index) => {

                const row =
                    document.createElement("div");

                row.className =
                    "history-item";


                const exp =
                    document.createElement("div");

                exp.className =
                    "history-expression";

                exp.textContent =
                    item.expression;


                const result =
                    document.createElement("div");

                result.className =
                    "history-result";

                result.textContent =
                    item.result;


                row.appendChild(exp);

                row.appendChild(result);


                row.addEventListener(
                    "click",
                    () => {

                        expression =
                            String(item.result);

                        resultElement.textContent =
                            item.result;

                        expressionElement.textContent =
                            item.expression;

                    }
                );


                historyList.appendChild(row);

            }
        );

    }


    function addHistory(
        exp,
        result
    ) {

        history.unshift({
            expression: exp,
            result: result
        });


        if (history.length > 20) {

            history =
                history.slice(0, 20);

        }


        saveHistory();

        renderHistory();

    }


    document
        .getElementById("clearHistory")
        .addEventListener(
            "click",
            () => {

                history = [];

                saveHistory();

                renderHistory();

            }
        );


    /* =========================
       显示
       ========================= */

    function updateDisplay() {

        expressionElement.textContent =
            expression || "Ready...";

    }


    function formatResult(value) {

        if (!Number.isFinite(value)) {

            throw new Error(
                "Math error"
            );

        }


        if (
            Math.abs(value) < 1e-12
        ) {

            value = 0;

        }


        return Number(
            value.toPrecision(12)
        ).toString();

    }


    /* =========================
       安全表达式计算
       ========================= */

    function evaluateExpression(
        input
    ) {

        let exp =
            input
                .replaceAll("×", "*")
                .replaceAll("÷", "/")
                .replaceAll("−", "-")
                .replaceAll("π", "PI");


        /*
         * 自动补乘号
         *
         * 2π
         * 2(3+4)
         * )( 
         */

        exp =
            exp.replace(
                /(\d|\))(?=\()/g,
                "$1*"
            );


        exp =
            exp.replace(
                /(\d|\))(?=PI)/g,
                "$1*"
            );


        exp =
            exp.replace(
                /(PI|\d|\))(?=e)/g,
                "$1*"
            );


        /*
         * xʸ
         */

        exp =
            exp.replaceAll(
                "^",
                "**"
            );


        /*
         * 百分号
         */

        exp =
            exp.replace(
                /(\d+(?:\.\d+)?)%/g,
                "($1/100)"
            );


        /*
         * Ans
         */

        exp =
            exp.replaceAll(
                "Ans",
                `(${lastResult})`
            );


        /*
         * 数学常数
         */

        exp =
            exp.replaceAll(
                "PI",
                "Math.PI"
            );


        /*
         * e
         *
         * 避免误替换科学计数法
         */

        exp =
            exp.replace(
                /(?<![A-Za-z0-9_.])e(?![A-Za-z0-9_])/g,
                "Math.E"
            );


        /*
         * 只允许安全字符
         */

        if (
            !/^[0-9+\-*/().,\s*]+(?:Math\.PI|Math\.E)?[0-9+\-*/().,\sA-Za-z]*$/
                .test(exp)
        ) {

            throw new Error(
                "Invalid expression"
            );

        }


        /*
         * 最终计算
         */

        const fn =
            new Function(
                `"use strict"; return (${exp})`
            );


        const value =
            fn();


        return value;

    }


    /* =========================
       三角函数
       ========================= */

    function toRadians(value) {

        if (angleMode === "DEG") {

            return value *
                Math.PI /
                180;

        }

        return value;

    }


    function fromRadians(value) {

        if (angleMode === "DEG") {

            return value *
                180 /
                Math.PI;

        }

        return value;

    }


    function calculateFunction(
        type
    ) {

        let value;


        try {

            value =
                evaluateExpression(
                    expression
                );

        }

        catch {

            value =
                lastResult;

        }


        let answer;


        switch (type) {

            case "sin":

                answer =
                    Math.sin(
                        toRadians(value)
                    );

                break;


            case "cos":

                answer =
                    Math.cos(
                        toRadians(value)
                    );

                break;


            case "tan":

                answer =
                    Math.tan(
                        toRadians(value)
                    );

                break;


            case "asin":

                answer =
                    fromRadians(
                        Math.asin(value)
                    );

                break;


            case "acos":

                answer =
                    fromRadians(
                        Math.acos(value)
                    );

                break;


            case "atan":

                answer =
                    fromRadians(
                        Math.atan(value)
                    );

                break;


            case "ln":

                answer =
                    Math.log(value);

                break;


            case "log":

                answer =
                    Math.log10(value);

                break;


            case "sqrt":

                answer =
                    Math.sqrt(value);

                break;


            case "cbrt":

                answer =
                    Math.cbrt(value);

                break;


            case "square":

                answer =
                    value ** 2;

                break;


            case "cube":

                answer =
                    value ** 3;

                break;


            case "inverse":

                answer =
                    1 / value;

                break;


            case "exp":

                answer =
                    Math.exp(value);

                break;


            case "tenPower":

                answer =
                    10 ** value;

                break;


            case "factorial":

                answer =
                    factorial(value);

                break;


            default:

                answer =
                    value;

        }


        const formatted =
            formatResult(answer);


        const oldExpression =
            expression ||
            String(value);


        expressionElement.textContent =
            oldExpression;


        expression =
            formatted;


        resultElement.textContent =
            formatted;


        lastResult =
            answer;


        ansElement.textContent =
            formatted;

    }


    /* =========================
       阶乘
       ========================= */

    function factorial(n) {

        n = Number(n);


        if (
            !Number.isInteger(n) ||
            n < 0 ||
            n > 170
        ) {

            throw new Error(
                "Invalid factorial"
            );

        }


        let result = 1;


        for (
            let i = 2;
            i <= n;
            i++
        ) {

            result *= i;

        }


        return result;

    }


    /* =========================
       普通计算
       ========================= */

    function calculate() {

        if (!expression) {

            return;

        }


        try {

            const oldExpression =
                expression;


            const value =
                evaluateExpression(
                    expression
                );


            const formatted =
                formatResult(value);


            lastResult =
                value;


            expression =
                formatted;


            expressionElement.textContent =
                oldExpression;


            resultElement.textContent =
                formatted;


            ansElement.textContent =
                formatted;


            addHistory(
                oldExpression,
                formatted
            );

        }

        catch (error) {

            resultElement.textContent =
                "ERROR";

            console.error(error);

        }

    }


    /* =========================
       按钮处理
       ========================= */

    document
        .querySelectorAll(
            "button[data-value]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const value =
                            button.dataset.value;


                        /*
                         * 运算符
                         */

                        if (
                            ["+","-","*","/"]
                                .includes(value)
                        ) {

                            /*
                             * 如果当前为空，
                             * 允许使用 Ans 作为左值
                             */

                            if (!expression) {

                                expression =
                                    String(
                                        lastResult
                                    );

                            }


                            expression +=
                                value;

                        }

                        else {

                            expression +=
                                value;

                        }


                        updateDisplay();

                    }
                );

            }
        );


    document
        .querySelectorAll(
            "button[data-action]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        handleAction(
                            button.dataset.action
                        );

                    }
                );

            }
        );


    function handleAction(
        action
    ) {

        switch (action) {

            /* =====================
               清除
               ===================== */

            case "clear":

                expression = "";

                resultElement.textContent =
                    "0";

                expressionElement.textContent =
                    "Ready...";

                break;


            /* =====================
               删除
               ===================== */

            case "delete":

                expression =
                    expression.slice(
                        0,
                        -1
                    );

                updateDisplay();

                break;


            /* =====================
               等号
               ===================== */

            case "calculate":

                calculate();

                break;


            /* =====================
               三角函数
               ===================== */

            case "sin":
            case "cos":
            case "tan":
            case "asin":
            case "acos":
            case "atan":
            case "ln":
            case "log":
            case "sqrt":
            case "cbrt":
            case "square":
            case "cube":
            case "inverse":
            case "exp":
            case "tenPower":
            case "factorial":

                calculateFunction(
                    action
                );

                break;


            /* =====================
               幂
               ===================== */

            case "power":

                expression +=
                    "^";

                updateDisplay();

                break;


            /* =====================
               π
               ===================== */

            case "pi":

                expression +=
                    "π";

                updateDisplay();

                break;


            /* =====================
               e
               ===================== */

            case "e":

                expression +=
                    "e";

                updateDisplay();

                break;


            /* =====================
               括号
               ===================== */

            case "open":

                expression +=
                    "(";

                updateDisplay();

                break;


            case "close":

                expression +=
                    ")";

                updateDisplay();

                break;


            /* =====================
               百分比
               ===================== */

            case "percent":

                expression +=
                    "%";

                updateDisplay();

                break;


            /* =====================
               Ans
               ===================== */

            case "ans":

                expression +=
                    String(lastResult);

                updateDisplay();

                break;


            /* =====================
               正负
               ===================== */

            case "toggleSign":

                if (!expression) {

                    expression =
                        "-";

                }

                else {

                    expression =
                        `(-${expression})`;

                }

                updateDisplay();

                break;


            /* =====================
               角度模式
               ===================== */

            case "toggleAngle":

                angleMode =
                    angleMode === "DEG"
                        ? "RAD"
                        : "DEG";


                document
                    .getElementById(
                        "angleMode"
                    )
                    .classList.toggle(
                        "active",
                        angleMode === "DEG"
                    );


                document
                    .getElementById(
                        "radMode"
                    )
                    .classList.toggle(
                        "active",
                        angleMode === "RAD"
                    );

                break;


            /* =====================
               RAND
               ===================== */

            case "random":

                expression =
                    formatResult(
                        Math.random()
                    );

                resultElement.textContent =
                    expression;

                updateDisplay();

                break;


            /* =====================
               内存
               ===================== */

            case "memoryClear":

                memory = 0;

                break;


            case "memoryRecall":

                expression +=
                    String(memory);

                updateDisplay();

                break;


            case "memoryAdd":

                try {

                    memory +=
                        evaluateExpression(
                            expression ||
                            String(lastResult)
                        );

                }

                catch {

                    memory +=
                        lastResult;

                }

                break;


            case "memorySubtract":

                try {

                    memory -=
                        evaluateExpression(
                            expression ||
                            String(lastResult)
                        );

                }

                catch {

                    memory -=
                        lastResult;

                }

                break;

        }

    }


    /* =========================
       键盘
       ========================= */

    document.addEventListener(
        "keydown",
        event => {

            const key =
                event.key;


            if (
                /[0-9]/.test(key) ||
                key === "."
            ) {

                expression +=
                    key;

                updateDisplay();

                return;

            }


            if (
                ["+","-","*","/","(",")","%"]
                    .includes(key)
            ) {

                expression +=
                    key;

                updateDisplay();

                return;

            }


            if (key === "^") {

                expression +=
                    "^";

                updateDisplay();

                return;

            }


            if (
                key === "Enter" ||
                key === "="
            ) {

                event.preventDefault();

                calculate();

                return;

            }


            if (
                key === "Backspace"
            ) {

                expression =
                    expression.slice(
                        0,
                        -1
                    );

                updateDisplay();

                return;

            }


            if (key === "Escape") {

                expression = "";

                resultElement.textContent =
                    "0";

                expressionElement.textContent =
                    "Ready...";

            }

        }
    );


    /* =========================
       启动
       ========================= */

    renderHistory();

</script>

</body>
