<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JERRY // CALCULATOR</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #05070a;
    color: #e8edf2;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    overflow-x: hidden;
}

/* =========================
   背景
   ========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    pointer-events: none;

    opacity: 0.16;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.06) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.06) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
}

/* =========================
   导航
   ========================= */

nav {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;

    background: rgba(5,7,10,0.78);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border-bottom:
        1px solid rgba(255,255,255,0.08);

    z-index: 20;
}

.logo {
    font-weight: 800;

    letter-spacing: 4px;

    font-size: 18px;
}

.logo span {
    opacity: 0.45;
}

nav a {
    color: #aeb8c2;

    text-decoration: none;

    margin-left: 28px;

    font-size: 13px;

    letter-spacing: 1px;

    transition: 0.25s;
}

nav a:hover {
    color: white;
}

/* =========================
   鼠标光晕
   ========================= */

.glow {
    position: fixed;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(120,150,255,0.10),
            transparent 65%
        );

    transform:
        translate(-50%, -50%);

    z-index: -1;
}

/* =========================
   页面
   ========================= */

.calculator-page {
    width: 100%;

    min-height: 100vh;

    padding:
        115px 5% 70px;
}

/* =========================
   标题
   ========================= */

.page-header {
    max-width: 1050px;

    margin: 0 auto 25px;
}

.page-label {
    color: #6cff9b;

    font-family: monospace;

    font-size: 12px;

    letter-spacing: 3px;

    margin-bottom: 12px;
}

.page-header h1 {
    margin: 0;

    font-size: clamp(40px, 7vw, 72px);

    line-height: 1;

    letter-spacing: -3px;

    font-weight: 900;

    background:
        linear-gradient(
            120deg,
            #ffffff,
            #9aa6b2
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.page-header p {
    margin: 15px 0 0;

    color: #69747f;

    font-family: monospace;

    font-size: 13px;
}

/* =========================
   主布局
   ========================= */

.calculator-layout {
    max-width: 1050px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        280px;

    gap: 20px;

    align-items: start;
}

/* =========================
   计算器主体
   ========================= */

.calculator {
    width: 100%;

    padding: 20px;

    background:
        rgba(255,255,255,0.035);

    border:
        1px solid rgba(255,255,255,0.09);

    border-radius: 18px;

    box-shadow:
        0 0 40px rgba(0,0,0,0.25);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

/* =========================
   显示屏
   ========================= */

.display {
    width: 100%;

    min-height: 105px;

    padding: 16px 18px;

    margin-bottom: 14px;

    background:
        rgba(0,0,0,0.38);

    border:
        1px solid rgba(108,255,155,0.14);

    border-radius: 12px;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    text-align: right;

    overflow: hidden;
}

.expression {
    min-height: 22px;

    color: #69747f;

    font-family: monospace;

    font-size: 13px;

    white-space: nowrap;

    overflow-x: auto;

    scrollbar-width: none;
}

.expression::-webkit-scrollbar {
    display: none;
}

.result {
    margin-top: 7px;

    color: #e8edf2;

    font-family: monospace;

    font-size: clamp(28px, 5vw, 42px);

    font-weight: 600;

    line-height: 1.1;

    white-space: nowrap;

    overflow-x: auto;

    scrollbar-width: none;
}

.result::-webkit-scrollbar {
    display: none;
}

/* =========================
   模式栏
   ========================= */

.mode-bar {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 12px;
}

.mode-left,
.mode-right {
    display: flex;

    align-items: center;

    gap: 7px;
}

.mode-button {
    height: 30px;

    padding: 0 10px;

    border:
        1px solid rgba(255,255,255,0.09);

    border-radius: 7px;

    background:
        rgba(255,255,255,0.035);

    color: #69747f;

    font-family: monospace;

    font-size: 10px;

    cursor: pointer;

    transition: 0.2s;
}

.mode-button:hover {
    color: white;

    border-color:
        rgba(255,255,255,0.18);
}

.mode-button.active {
    color: #6cff9b;

    border-color:
        rgba(108,255,155,0.4);

    background:
        rgba(108,255,155,0.06);
}

.memory-display {
    color: #56616c;

    font-family: monospace;

    font-size: 10px;
}

/* =========================
   科学计算区域
   8列
   ========================= */

.scientific-buttons {
    display: grid;

    grid-template-columns:
        repeat(8, minmax(0, 1fr));

    gap: 7px;

    margin-bottom: 9px;
}

/* =========================
   基础计算区域
   ========================= */

.basic-area {
    display: grid;

    grid-template-columns:
        1fr 3fr;

    gap: 7px;
}

/* 左侧功能 */
.utility-buttons {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    grid-auto-rows: 48px;

    gap: 7px;
}

/* 数字与运算 */
.number-buttons {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    grid-template-rows:
        repeat(4, 48px);

    gap: 7px;
}

/* =========================
   所有按钮
   ========================= */

.calc-button {
    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 8px;

    background:
        rgba(255,255,255,0.045);

    color: #c4ccd3;

    font-family: monospace;

    font-size: 13px;

    cursor: pointer;

    transition:
        background 0.15s,
        border-color 0.15s,
        color 0.15s,
        transform 0.1s;

    user-select: none;

    min-width: 0;

    overflow: hidden;
}

.calc-button:hover {
    background:
        rgba(255,255,255,0.085);

    border-color:
        rgba(255,255,255,0.18);

    color: white;
}

.calc-button:active {
    transform: scale(0.96);

    background:
        rgba(108,255,155,0.10);
}

/* 科学按钮 */
.scientific-button {
    height: 42px;

    color: #89949f;

    font-size: 11px;
}

/* 运算符 */
.operator {
    color: #6cff9b;

    background:
        rgba(108,255,155,0.045);

    border-color:
        rgba(108,255,155,0.14);
}

.operator:hover {
    color: #6cff9b;

    border-color:
        rgba(108,255,155,0.35);
}

/* 清除 */
.clear {
    color: #ff9b9b;

    background:
        rgba(255,100,100,0.035);

    border-color:
        rgba(255,100,100,0.13);
}

.clear:hover {
    color: #ffb0b0;

    border-color:
        rgba(255,100,100,0.3);
}

/* 等号 */
.equals {
    color: #05070a;

    background: #6cff9b;

    border-color: #6cff9b;

    font-weight: 800;

    font-size: 17px;
}

.equals:hover {
    color: #05070a;

    background: #83ffaa;

    border-color: #83ffaa;
}

/* 数字 */
.number {
    color: #e8edf2;

    font-size: 16px;

    background:
        rgba(255,255,255,0.055);
}

/* =========================
   历史记录
   ========================= */

.history-panel {
    width: 100%;

    min-height: 400px;

    padding: 18px;

    background:
        rgba(255,255,255,0.035);

    border:
        1px solid rgba(255,255,255,0.09);

    border-radius: 16px;

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.history-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;

    padding-bottom: 12px;

    border-bottom:
        1px solid rgba(255,255,255,0.07);
}

.history-title {
    color: #6cff9b;

    font-family: monospace;

    font-size: 12px;

    letter-spacing: 2px;
}

.clear-history {
    border: none;

    background: transparent;

    color: #56616c;

    font-family: monospace;

    font-size: 10px;

    cursor: pointer;
}

.clear-history:hover {
    color: #ff9b9b;
}

.history-list {
    display: flex;

    flex-direction: column;

    gap: 8px;

    max-height: 500px;

    overflow-y: auto;
}

.history-empty {
    padding: 35px 5px;

    text-align: center;

    color: #505a64;

    font-family: monospace;

    font-size: 11px;

    line-height: 1.8;
}

.history-item {
    padding: 10px 11px;

    background:
        rgba(0,0,0,0.16);

    border:
        1px solid rgba(255,255,255,0.055);

    border-radius: 8px;

    cursor: pointer;

    transition: 0.2s;
}

.history-item:hover {
    border-color:
        rgba(108,255,155,0.2);

    background:
        rgba(108,255,155,0.035);
}

.history-expression {
    color: #69747f;

    font-family: monospace;

    font-size: 10px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.history-result {
    margin-top: 4px;

    color: #dce2e7;

    font-family: monospace;

    font-size: 13px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

/* =========================
   快捷键提示
   ========================= */

.keyboard-help {
    max-width: 1050px;

    margin: 18px auto 0;

    color: #414b54;

    font-family: monospace;

    font-size: 10px;

    text-align: right;
}

/* =========================
   手机端
   ========================= */

@media (max-width: 850px) {

    .calculator-layout {
        grid-template-columns: 1fr;
    }

    .history-panel {
        min-height: auto;
    }

    .history-list {
        max-height: 280px;
    }
}

@media (max-width: 650px) {

    nav {
        padding: 0 5%;
    }

    nav a {
        margin-left: 10px;

        font-size: 10px;
    }

    .calculator-page {
        padding:
            100px 3% 50px;
    }

    .calculator {
        padding: 12px;

        border-radius: 14px;
    }

    .scientific-buttons {
        gap: 5px;
    }

    .scientific-button {
        height: 39px;

        font-size: 9px;
    }

    .basic-area {
        grid-template-columns:
            1fr 3fr;

        gap: 5px;
    }

    .utility-buttons {
        gap: 5px;

        grid-auto-rows: 43px;
    }

    .number-buttons {
        grid-template-rows:
            repeat(4, 43px);

        gap: 5px;
    }

    .calc-button {
        font-size: 11px;
    }

    .number {
        font-size: 15px;
    }

    .equals {
        font-size: 15px;
    }

    .page-header h1 {
        letter-spacing: -2px;
    }
}

@media (max-width: 420px) {

    nav .logo {
        font-size: 14px;

        letter-spacing: 2px;
    }

    nav a {
        margin-left: 6px;

        font-size: 8px;
    }

    .calculator-page {
        padding-left: 2%;

        padding-right: 2%;
    }

    .scientific-buttons {
        gap: 3px;
    }

    .scientific-button {
        height: 35px;

        font-size: 8px;
    }

    .basic-area {
        gap: 4px;
    }

    .utility-buttons {
        gap: 4px;

        grid-auto-rows: 40px;
    }

    .number-buttons {
        gap: 4px;

        grid-template-rows:
            repeat(4, 40px);
    }

    .calc-button {
        border-radius: 6px;

        font-size: 10px;
    }

    .number {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="glow" id="glow"></div>

<nav>
    <div class="logo">
        JERRY<span> / 2026</span>
    </div>

    <div>
        <a href="index.html">HOME</a>
        <a href="index.html#项目与展示">PROJECTS</a>
    </div>
</nav>


<main class="calculator-page">

    <div class="page-header">

        <div class="page-label">
            TOOL_001 / CALCULATOR
        </div>

        <h1>CALCULATOR</h1>

        <p>
            SCIENTIFIC CALCULATION SYSTEM // LOCAL TOOL
        </p>

    </div>


    <div class="calculator-layout">


        <!-- =========================
             计算器
             ========================= -->

        <div class="calculator">


            <!-- 显示屏 -->

            <div class="display">

                <div
                    class="expression"
                    id="expression"
                ></div>

                <div
                    class="result"
                    id="result"
                >
                    0
                </div>

            </div>


            <!-- 模式 -->

            <div class="mode-bar">

                <div class="mode-left">

                    <button
                        class="mode-button active"
                        id="deg-button"
                        onclick="setAngleMode('DEG')"
                    >
                        DEG
                    </button>

                    <button
                        class="mode-button"
                        id="rad-button"
                        onclick="setAngleMode('RAD')"
                    >
                        RAD
                    </button>

                </div>


                <div class="mode-right">

                    <span
                        class="memory-display"
                        id="memory-display"
                    >
                        M: 0
                    </span>

                </div>

            </div>


            <!-- =========================
                 科学功能
                 ========================= -->

            <div class="scientific-buttons">


                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('sin(')"
                >
                    sin
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('cos(')"
                >
                    cos
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('tan(')"
                >
                    tan
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('asin(')"
                >
                    asin
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('acos(')"
                >
                    acos
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('atan(')"
                >
                    atan
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('sinh(')"
                >
                    sinh
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('cosh(')"
                >
                    cosh
                </button>


                <button
                    class="calc-button scientific-button"
                    onclick="square()"
                >
                    x²
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="cube()"
                >
                    x³
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertOperator('^')"
                >
                    xʸ
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('sqrt(')"
                >
                    √x
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('cbrt(')"
                >
                    ∛x
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="reciprocal()"
                >
                    1/x
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('ln(')"
                >
                    ln
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('log(')"
                >
                    log
                </button>


                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('exp(')"
                >
                    eˣ
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertFunction('pow10(')"
                >
                    10ˣ
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertConstant('π')"
                >
                    π
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertConstant('e')"
                >
                    e
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="factorial()"
                >
                    n!
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="insertOperator('%')"
                >
                    %
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="randomNumber()"
                >
                    RAND
                </button>

                <button
                    class="calc-button scientific-button"
                    onclick="ans()"
                >
                    ANS
                </button>

            </div>


            <!-- =========================
                 基础计算区域
                 ========================= -->

            <div class="basic-area">


                <!-- 左侧功能 -->

                <div class="utility-buttons">

                    <button
                        class="calc-button clear"
                        onclick="clearAll()"
                    >
                        AC
                    </button>

                    <button
                        class="calc-button"
                        onclick="deleteLast()"
                    >
                        DEL
                    </button>

                    <button
                        class="calc-button"
                        onclick="insertOperator('(')"
                    >
                        (
                    </button>

                    <button
                        class="calc-button"
                        onclick="insertOperator(')')"
                    >
                        )
                    </button>

                    <button
                        class="calc-button"
                        onclick="memoryClear()"
                    >
                        MC
                    </button>

                    <button
                        class="calc-button"
                        onclick="memoryRecall()"
                    >
                        MR
                    </button>

                    <button
                        class="calc-button"
                        onclick="memoryAdd()"
                    >
                        M+
                    </button>

                    <button
                        class="calc-button"
                        onclick="memorySubtract()"
                    >
                        M−
                    </button>

                </div>


                <!-- 数字区 -->

                <div class="number-buttons">


                    <!-- 第一行 -->

                    <button
                        class="calc-button number"
                        onclick="insertNumber('7')"
                    >
                        7
                    </button>

                    <button
                        class="calc-button number"
                        onclick="insertNumber('8')"
                    >
                        8
                    </button>

                    <button
                        class="calc-button number"
                        onclick="insertNumber('9')"
                    >
                        9
                    </button>

                    <button
                        class="calc-button operator"
                        onclick="insertOperator('/')"
                    >
                        ÷
                    </button>


                    <!-- 第二行 -->

                    <button
                        class="calc-button number"
                        onclick="insertNumber('4')"
                    >
                        4
                    </button>

                    <button
                        class="calc-button number"
                        onclick="insertNumber('5')"
                    >
                        5
                    </button>

                    <button
                        class="calc-button number"
                        onclick="insertNumber('6')"
                    >
                        6
                    </button>

                    <button
                        class="calc-button operator"
                        onclick="insertOperator('*')"
                    >
                        ×
                    </button>


                    <!-- 第三行 -->

                    <button
                        class="calc-button number"
                        onclick="insertNumber('1')"
                    >
                        1
                    </button>

                    <button
                        class="calc-button number"
                        onclick="insertNumber('2')"
                    >
                        2
                    </button>

                    <button
                        class="calc-button number"
                        onclick="insertNumber('3')"
                    >
                        3
                    </button>

                    <button
                        class="calc-button operator"
                        onclick="insertOperator('-')"
                    >
                        −
                    </button>


                    <!-- 第四行 -->

                    <button
                        class="calc-button number"
                        onclick="insertNumber('0')"
                    >
                        0
                    </button>

                    <button
                        class="calc-button"
                        onclick="insertNumber('.')"
                    >
                        .
                    </button>

                    <button
                        class="calc-button"
                        onclick="toggleSign()"
                    >
                        ±
                    </button>

                    <button
                        class="calc-button operator"
                        onclick="insertOperator('+')"
                    >
                        +
                    </button>

                </div>

            </div>


            <!-- 等号 -->

            <button
                class="calc-button equals"
                style="
                    width:100%;
                    height:48px;
                    margin-top:7px;
                "
                onclick="calculate()"
            >
                =
            </button>


          

        


        <!-- =========================
             历史记录
             ========================= -->

        <aside class="history-panel">

            <div class="history-header">

                <div class="history-title">
                    HISTORY
                </div>

                <button
                    class="clear-history"
                    onclick="clearHistory()"
                >
                    CLEAR
                </button>

            </div>


            <div
                class="history-list"
                id="history-list"
            >

                <div class="history-empty">
                    NO CALCULATIONS YET
                </div>

            </div>

        </aside>

    </div>


    <div class="keyboard-help">
        KEYBOARD: 0-9 / + - * / / ENTER / ESC / BACKSPACE
    </div>

</main>


<script>

/* =========================
   DOM
   ========================= */

const expressionElement =
    document.getElementById("expression");

const resultElement =
    document.getElementById("result");

const historyList =
    document.getElementById("history-list");

const memoryDisplay =
    document.getElementById("memory-display");

const degButton =
    document.getElementById("deg-button");

const radButton =
    document.getElementById("rad-button");


/* =========================
   状态
   ========================= */

let expression = "";

let lastResult = 0;

let memory = 0;

let angleMode = "DEG";


/* =========================
   历史记录
   ========================= */

let history =
    JSON.parse(
        localStorage.getItem(
            "jerryCalculatorHistory"
        ) || "[]"
    );


/* =========================
   输入数字
   ========================= */

function insertNumber(value) {

    expression += value;

    updateDisplay();

}


/* =========================
   常量
   ========================= */

function insertConstant(value) {

    if (
        expression &&
        /[\dπe)]$/.test(expression)
    ) {
        expression += "*";
    }

    expression += value;

    updateDisplay();

}


/* =========================
   运算符
   ========================= */

function insertOperator(operator) {

    if (operator === "(") {

        if (
            expression &&
            /[\dπe)]$/.test(expression)
        ) {
            expression += "*";
        }

        expression += "(";

        updateDisplay();

        return;
    }


    if (operator === ")") {

        expression += ")";

        updateDisplay();

        return;
    }


    if (operator === "%") {

        expression += "%";

        updateDisplay();

        return;
    }


    if (operator === "^") {

        expression += "^";

        updateDisplay();

        return;
    }


    if (!expression) {

        if (operator === "-") {

            expression = "-";

            updateDisplay();

        }

        return;
    }


    if (
        /[+\-*/^]$/.test(expression)
    ) {

        expression =
            expression.slice(0,-1) +
            operator;

    } else {

        expression += operator;

    }

    updateDisplay();

}


/* =========================
   函数
   ========================= */

function insertFunction(func) {

    if (
        expression &&
        /[\dπe)]$/.test(expression)
    ) {
        expression += "*";
    }

    expression += func;

    updateDisplay();

}


/* =========================
   更新显示
   ========================= */

function updateDisplay() {

    expressionElement.textContent =
        expression;

}


/* =========================
   清空
   ========================= */

function clearAll() {

    expression = "";

    resultElement.textContent = "0";

    expressionElement.textContent = "";

}


/* =========================
   删除
   ========================= */

function deleteLast() {

    expression =
        expression.slice(0,-1);

    updateDisplay();

}


/* =========================
   正负
   ========================= */

function toggleSign() {

    if (!expression) {

        expression = "-";

        updateDisplay();

        return;
    }

    expression =
        "-(" +
        expression +
        ")";

    updateDisplay();

}


/* =========================
   平方
   ========================= */

function square() {

    if (!expression) return;

    expression =
        "(" +
        expression +
        ")^2";

    updateDisplay();

}


/* =========================
   立方
   ========================= */

function cube() {

    if (!expression) return;

    expression =
        "(" +
        expression +
        ")^3";

    updateDisplay();

}


/* =========================
   倒数
   ========================= */

function reciprocal() {

    if (!expression) return;

    expression =
        "1/(" +
        expression +
        ")";

    updateDisplay();

}


/* =========================
   阶乘
   ========================= */

function factorial() {

    if (!expression) return;

    expression =
        "factorial(" +
        expression +
        ")";

    updateDisplay();

}


/* =========================
   随机数
   ========================= */

function randomNumber() {

    expression +=
        Math.random();

    updateDisplay();

}


/* =========================
   ANS
   ========================= */

function ans() {

    expression +=
        String(lastResult);

    updateDisplay();

}


/* =========================
   角度模式
   ========================= */

function setAngleMode(mode) {

    angleMode = mode;

    degButton.classList.toggle(
        "active",
        mode === "DEG"
    );

    radButton.classList.toggle(
        "active",
        mode === "RAD"
    );

}


/* =========================
   三角函数
   ========================= */

function sin(x) {

    return Math.sin(
        angleMode === "DEG"
            ? x * Math.PI / 180
            : x
    );

}

function cos(x) {

    return Math.cos(
        angleMode === "DEG"
            ? x * Math.PI / 180
            : x
    );

}

function tan(x) {

    return Math.tan(
        angleMode === "DEG"
            ? x * Math.PI / 180
            : x
    );

}

function asin(x) {

    const result =
        Math.asin(x);

    return angleMode === "DEG"
        ? result * 180 / Math.PI
        : result;

}

function acos(x) {

    const result =
        Math.acos(x);

    return angleMode === "DEG"
        ? result * 180 / Math.PI
        : result;

}

function atan(x) {

    const result =
        Math.atan(x);

    return angleMode === "DEG"
        ? result * 180 / Math.PI
        : result;

}

function sinh(x) {
    return Math.sinh(x);
}

function cosh(x) {
    return Math.cosh(x);
}


/* =========================
   数学函数
   ========================= */

function ln(x) {
    return Math.log(x);
}

function log(x) {
    return Math.log10(x);
}

function exp(x) {
    return Math.exp(x);
}

function pow10(x) {
    return Math.pow(10,x);
}

function sqrt(x) {
    return Math.sqrt(x);
}

function cbrt(x) {
    return Math.cbrt(x);
}


/* =========================
   阶乘
   ========================= */

function factorialNumber(n) {

    n = Number(n);

    if (!Number.isFinite(n)) {
        throw new Error("Invalid factorial");
    }

    if (n < 0) {
        throw new Error("Factorial requires n >= 0");
    }

    if (!Number.isInteger(n)) {
        throw new Error("Factorial requires integer");
    }

    if (n > 170) {
        throw new Error("Number too large");
    }

    let result = 1;

    for (
        let i = 2;
        i <= n;
        i++
    ) {
        result *= i;
    }

    return result;

}


/* =========================
   表达式计算
   ========================= */

function evaluateExpression(input) {

    let expr = input;

    expr =
        expr.replaceAll("π", "Math.PI");

    expr =
        expr.replace(/\be\b/g, "Math.E");

    expr =
        expr.replaceAll("^", "**");

    expr =
        expr.replaceAll("√", "sqrt");

    /*
       处理百分号
       例如 50% -> 0.5
    */

    expr =
        expr.replace(
            /(\d+(?:\.\d+)?)%/g,
            "($1/100)"
        );


    /*
       处理 factorial(...)
    */

    expr =
        expr.replace(
            /factorial\(([^()]*)\)/g,
            "factorialNumber($1)"
        );


    /*
       允许的表达式字符
    */

    const allowed =
        /^[0-9+\-*/%().,\sA-Za-z_]+$/;

    if (!allowed.test(expr)) {

        throw new Error(
            "Invalid characters"
        );

    }


    /*
       只允许这里定义的函数
    */

    const fn =
        new Function(
            "sin",
            "cos",
            "tan",
            "asin",
            "acos",
            "atan",
            "sinh",
            "cosh",
            "ln",
            "log",
            "exp",
            "pow10",
            "sqrt",
            "cbrt",
            "factorialNumber",
            "Math",
            `"use strict"; return (${expr});`
        );


    return fn(
        sin,
        cos,
        tan,
        asin,
        acos,
        atan,
        sinh,
        cosh,
        ln,
        log,
        exp,
        pow10,
        sqrt,
        cbrt,
        factorialNumber,
        Math
    );

}


/* =========================
   计算
   ========================= */

function calculate() {

    if (!expression) return;

    try {

        const original =
            expression;

        const value =
            evaluateExpression(
                expression
            );


        if (
            typeof value !== "number" ||
            !Number.isFinite(value)
        ) {

            throw new Error(
                "Invalid result"
            );

        }


        lastResult = value;

        const formatted =
            formatResult(value);

        resultElement.textContent =
            formatted;


        addHistory(
            original,
            formatted
        );


        expression =
            String(value);


    } catch (error) {

        console.error(error);

        resultElement.textContent =
            "ERROR";

    }

}


/* =========================
   格式化结果
   ========================= */

function formatResult(value) {

    if (
        Math.abs(value) >= 1e12 ||
        (
            Math.abs(value) > 0 &&
            Math.abs(value) < 1e-10
        )
    ) {

        return value.toExponential(8);

    }

    return Number(
        value.toPrecision(12)
    ).toString();

}


/* =========================
   内存
   ========================= */

function getCurrentValue() {

    try {

        return expression
            ? evaluateExpression(expression)
            : lastResult;

    } catch {

        return lastResult;

    }

}


function updateMemoryDisplay() {

    memoryDisplay.textContent =
        "M: " +
        formatResult(memory);

}


function memoryClear() {

    memory = 0;

    updateMemoryDisplay();

}


function memoryRecall() {

    expression +=
        String(memory);

    updateDisplay();

}


function memoryAdd() {

    memory +=
        getCurrentValue();

    updateMemoryDisplay();

}


function memorySubtract() {

    memory -=
        getCurrentValue();

    updateMemoryDisplay();

}


/* =========================
   历史记录
   ========================= */

function addHistory(
    expr,
    result
) {

    history.unshift({

        expression: expr,

        result: result,

        time: Date.now()

    });


    if (history.length > 30) {

        history =
            history.slice(0,30);

    }


    localStorage.setItem(
        "jerryCalculatorHistory",
        JSON.stringify(history)
    );


    renderHistory();

}


function renderHistory() {

    if (!history.length) {

        historyList.innerHTML = `
            <div class="history-empty">
                NO CALCULATIONS YET
            </div>
        `;

        return;

    }


    historyList.innerHTML =
        history.map(
            (item,index) => `

                <div
                    class="history-item"
                    onclick="useHistory(${index})"
                >

                    <div
                        class="history-expression"
                    >
                        ${escapeHtml(
                            item.expression
                        )}
                    </div>

                    <div
                        class="history-result"
                    >
                        = ${escapeHtml(
                            item.result
                        )}
                    </div>

                </div>

            `
        ).join("");

}


function useHistory(index) {

    const item =
        history[index];

    if (!item) return;

    expression =
        item.expression;

    resultElement.textContent =
        item.result;

    updateDisplay();

}


function clearHistory() {

    history = [];

    localStorage.removeItem(
        "jerryCalculatorHistory"
    );

    renderHistory();

}


/* =========================
   HTML 转义
   ========================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   键盘
   ========================= */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key;


        if (
            /^[0-9.]$/.test(key)
        ) {

            insertNumber(key);

            event.preventDefault();

            return;

        }


        if (
            ["+","-","*","/","%","^"].includes(key)
        ) {

            insertOperator(key);

            event.preventDefault();

            return;

        }


        if (key === "(") {

            insertOperator("(");

            event.preventDefault();

            return;

        }


        if (key === ")") {

            insertOperator(")");

            event.preventDefault();

            return;

        }


        if (
            key === "Enter" ||
            key === "="
        ) {

            calculate();

            event.preventDefault();

            return;

        }


        if (
            key === "Backspace"
        ) {

            deleteLast();

            event.preventDefault();

            return;

        }


        if (
            key === "Escape"
        ) {

            clearAll();

            event.preventDefault();

            return;

        }

    }
);


/* =========================
   鼠标光晕
   ========================= */

const glow =
    document.getElementById("glow");


document.addEventListener(
    "mousemove",
    function(event) {

        glow.style.left =
            event.clientX + "px";

        glow.style.top =
            event.clientY + "px";

    }
);


/* =========================
   启动
   ========================= */

updateMemoryDisplay();

renderHistory();

</script>
